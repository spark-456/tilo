<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./tilo-daylight.css">
<link rel="stylesheet" href="./tilo-studio.css">
<link rel="stylesheet" href="./tilo-t.css">
<style>body{margin:0;-webkit-font-smoothing:antialiased}</style>
</helmet>
<div data-theme="{{ theme }}" data-screen-label="Pool loader" aria-busy="{{ busy }}" style="position:relative;width:100%;height:{{ H }};overflow:hidden;background:var(--bg);font-family:var(--fB);color:var(--ink)">
  <div style="position:absolute;inset:0;filter:{{ blur }};transform:{{ ush }};transition:filter .8s ease {{ blurDl }}, transform .8s ease {{ blurDl }}">
    <sc-if value="{{ uHome }}" hint-placeholder-val="{{ true }}"><dc-import name="Tilo T Home" device="{{ device }}" theme="{{ theme }}" hint-size="100%,100%"></dc-import></sc-if>
    <sc-if value="{{ uWorld }}" hint-placeholder-val="{{ false }}"><dc-import name="Tilo T World" device="{{ device }}" theme="{{ theme }}" state="planning" hint-size="100%,100%"></dc-import></sc-if>
  </div>
  <div style="position:absolute;inset:0;background:var(--bg);opacity:{{ scrimO }};transition:opacity .8s ease {{ blurDl }};pointer-events:none"></div>
  <sc-if value="{{ show }}" hint-placeholder-val="{{ true }}">
  <div role="status" aria-live="polite" style="position:absolute;left:50%;top:50%;width:0;height:0;transform:scale({{ k }})">
    <div style="position:absolute;left:-190px;top:-65px;width:380px;height:130px;animation:{{ poolAnim }}">
      <div style="position:absolute;inset:0;border-radius:50%;background:var(--card);border:1px solid var(--line2)"></div>
      <div style="position:absolute;inset:9px;border-radius:50%;background:radial-gradient(ellipse at 50% 35%,#C9E8F1 0%,#9FCFE0 45%,#6FB2CB 100%);box-shadow:inset 0 12px 0 rgba(11,11,12,.10)"></div>
      <sc-for list="{{ rings }}" as="r" hint-placeholder-count="3"><div style="position:absolute;inset:{{ r.i }};border-radius:50%;border:2px solid rgba(255,255,255,.75);animation:tRipple 2.6s ease-out {{ r.d }} infinite"></div></sc-for>
      <sc-if value="{{ leap }}" hint-placeholder-val="{{ true }}"><div style="position:absolute;left:50%;top:50%;width:140px;height:40px;margin:-20px 0 0 -70px;border-radius:50%;background:#0B0B0C;opacity:0;animation:tLeapShadow {{ leapD }} cubic-bezier(.5,0,.5,1) {{ leapIt }}"></div></sc-if>
    </div>
    <sc-if value="{{ leap }}" hint-placeholder-val="{{ true }}">
      <div style="position:absolute;left:-51px;top:-100px;width:102px;height:120px;transform-origin:50% 100%;animation:tLeap {{ leapD }} cubic-bezier(.5,0,.5,1) {{ leapIt }}"><dc-import name="Tilo S Buddy" size="120" mood="happy" hint-size="102px,120px"></dc-import></div>
      <div style="position:absolute;left:-181px;top:-56px;width:362px;height:112px;border-radius:50%;background:radial-gradient(ellipse at 50% 35%,#C9E8F1 0%,#9FCFE0 45%,#6FB2CB 100%);clip-path:inset(50% 0 0 0)"></div>
      <div style="position:absolute;left:0;top:0;width:0;height:0">
        <sc-for list="{{ drops }}" as="x" hint-placeholder-count="12"><span style="position:absolute;left:-6px;top:-8px;width:{{ x.w }};height:{{ x.h }};border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;background:{{ x.c }};border:1.5px solid #0B0B0C;box-sizing:border-box;opacity:0;--dx:{{ x.dx }};--dy:{{ x.dy }};animation:tDrop .95s cubic-bezier(.2,.7,.4,1) {{ x.dl }} {{ leapIt }}"></span></sc-for>
        <div style="position:absolute;left:-150px;top:-46px;width:300px;height:92px;border-radius:50%;border:3px solid #FFFFFF;opacity:0;animation:tRipple 1s ease-out {{ splashDl }} {{ leapIt }}"></div>
      </div>
    </sc-if>
    <sc-if value="{{ swim }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:0;top:0;width:0;height:0">
        <div style="position:absolute;left:0;top:0;width:66px;height:52px;offset-path:path('M -122 0 A 122 32 0 1 1 122 0 A 122 32 0 1 1 -122 0');offset-rotate:0deg;offset-anchor:50% 100%;animation:tSwim 4.2s linear infinite">
          <div style="position:absolute;left:4px;top:0;width:58px;height:44px;overflow:hidden"><div style="position:absolute;left:2px;top:2px"><dc-import name="Tilo S Buddy" size="64" mood="swim" hint-size="54px,64px"></dc-import></div></div>
          <div style="position:absolute;left:-6px;bottom:2px;width:78px;height:16px;border-radius:50%;border:2.5px solid #FFFFFF;box-sizing:border-box;animation:tsBob 1.4s ease-in-out infinite"></div>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{ sink }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:-40px;top:-74px;width:80px;height:74px;overflow:hidden"><div style="position:absolute;left:6px;top:6px;animation:tSink 1.4s cubic-bezier(.5,0,.75,0) both"><dc-import name="Tilo S Buddy" size="80" mood="hand" hint-size="68px,80px"></dc-import></div></div>
      <div style="position:absolute;left:-56px;top:-10px;width:112px;height:20px;border-radius:50%;border:2.5px solid #FFFFFF;box-sizing:border-box;animation:tRipple 1.2s ease-out .9s both"></div>
      <sc-for list="{{ bubbles }}" as="b" hint-placeholder-count="5"><span style="position:absolute;left:{{ b.x }};top:-6px;width:{{ b.s }};height:{{ b.s }};border-radius:99px;border:2px solid #FFFFFF;box-sizing:border-box;opacity:0;animation:tBubble 1.2s ease-out {{ b.d }} both"></span></sc-for>
    </sc-if>
    <div style="position:absolute;left:-200px;top:96px;width:400px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;animation:tCaption .4s ease-out both">
      <span style="font-weight:700;font-size:18px;letter-spacing:-.3px">{{ cap }}</span>
      <span style="font-family:var(--mono);font-size:12px;color:var(--ink2)">{{ capS }}</span>
    </div>
  </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;phase&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;live&quot;,&quot;leap&quot;,&quot;swim&quot;,&quot;sink&quot;,&quot;done&quot;],&quot;default&quot;:&quot;live&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;task&quot;,&quot;site&quot;],&quot;default&quot;:&quot;task&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;under&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;world&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;device&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;desktop&quot;,&quot;phone&quot;],&quot;default&quot;:&quot;desktop&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;studio&quot;,&quot;studioDark&quot;],&quot;default&quot;:&quot;studio&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { ph: 'leap', n: 0 };
  componentDidMount() { this.run(); }
  componentWillUnmount() { clearTimeout(this.tm); }
  run() {
    clearTimeout(this.tm);
    if ((this.props.phase ?? 'live') !== 'live') return;
    const D = { leap: [2600, 'swim'], swim: [7600, 'sink'], sink: [2000, 'done'], done: [2800, 'leap'] }, cur = D[this.state.ph];
    this.tm = setTimeout(() => { this.setState(s => ({ ph: cur[1], n: s.n + 1 }), () => this.run()); }, cur[0]);
  }
  renderVals() {
    const p = this.props, phase = p.phase ?? 'live', ph = phase === 'live' ? this.state.ph : phase, d = (p.device ?? 'desktop') === 'desktop';
    const live = phase === 'live', leapIt = live ? '1 both' : 'infinite', leapD = live ? '2.6s' : '3.4s';
    const done = ph === 'done';
    const kind = p.kind ?? 'task';
    const CAP = kind === 'site' ? { leap: ['Loading Tilo', 'fetching your worlds'], swim: ['Almost there', 'still fetching · 2 of 3 lists loaded'], sink: ['Ready', ''], done: ['', ''] } : { leap: ['Starting your world', 'world.started'], swim: ['The Director is still planning', 'agent.spawned · waiting for world.planned'], sink: ['Your plan is ready', 'world.planned'], done: ['', ''] };
    const drops = Array.from({ length: 12 }, (_, i) => { const a = Math.PI * (1.05 + i / 11 * .9), r = 70 + (i * 29) % 60; return { dx: (Math.cos(a) * r * 1.6).toFixed(0) + 'px', dy: (Math.sin(a) * r * 1.2 - 30).toFixed(0) + 'px', w: (i % 3 ? 10 : 14) + 'px', h: (i % 3 ? 13 : 18) + 'px', c: i % 4 ? '#9FCFE0' : '#FFFFFF', dl: (live ? 2.6 : 3.4) * .86 + (i % 4) * .03 + 's' }; });
    return {
      theme: p.theme ?? 'studio', device: d ? 'desktop' : 'phone', H: d ? '900px' : '844px', k: d ? '1.25' : '.8',
      uHome: (p.under ?? 'home') === 'home', uWorld: p.under === 'world',
      busy: done ? 'false' : 'true', show: !done, blur: done ? 'none' : 'blur(8px) saturate(.85)', ush: done ? 'none' : 'scale(1.015)', scrimO: done ? '0' : '.35', blurDl: ph === 'sink' ? '1.1s' : '0s',
      poolAnim: ph === 'sink' ? 'tPoolClose .7s cubic-bezier(.5,0,.75,0) 1.15s both' : ph === 'leap' ? 'tPoolOpen .5s cubic-bezier(.2,.8,.2,1) both' : 'none',
      rings: [['30px 60px', '0s'], ['20px 40px', '.9s'], ['10px 20px', '1.8s']].map(([i, dd]) => ({ i, d: dd })),
      leap: ph === 'leap', swim: ph === 'swim', sink: ph === 'sink', leapIt, leapD, drops, splashDl: (live ? 2.6 : 3.4) * .87 + 's',
      bubbles: [[-14, 8, '.2s'], [6, 6, '.4s'], [-2, 10, '.6s'], [14, 5, '.75s'], [-20, 6, '.9s']].map(([x, s, dd]) => ({ x: x + 'px', s: s + 'px', d: dd })),
      cap: (CAP[ph] || CAP.leap)[0], capS: (CAP[ph] || CAP.leap)[1]
    };
  }
}
</script>
</body>
</html>
