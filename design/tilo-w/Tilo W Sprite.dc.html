<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./tilo-t.css">
<link rel="stylesheet" href="./tilo-w.css">
<style>body{margin:0}</style>
</helmet>
<div aria-hidden="true" style="position:relative;width:{{ w }};height:{{ h }}">
  <div style="position:absolute;left:0;top:0;width:32px;height:40px;transform:scale({{ k }});transform-origin:0 0">
    <span style="position:absolute;left:6px;top:34px;width:20px;height:6px;border-radius:50%;background:#000000;opacity:.16"></span>
    <sc-if value="{{ lit }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:0;top:31px;width:32px;height:12px;box-sizing:border-box;border-radius:50%;border:2px solid {{ col }};animation:wRing .18s ease-out both"></span></sc-if>
    <div style="position:absolute;left:0;top:0;width:32px;height:40px;transform:{{ faceT }};transform-origin:16px 20px">
      <div style="position:absolute;left:0;top:0;width:32px;height:40px;transform-origin:16px 37px;transform:{{ bodyS }};animation:{{ bobA }}">
        <span style="position:absolute;left:10px;top:27px;width:5px;height:9px;border-radius:2px;background:{{ limb }};transform-origin:2.5px 1px;transform:{{ legLS }};animation:{{ legLA }}"></span>
        <span style="position:absolute;left:17px;top:27px;width:5px;height:9px;border-radius:2px;background:{{ limbD }};transform-origin:2.5px 1px;transform:{{ legRS }};animation:{{ legRA }}"></span>
        <span style="position:absolute;left:3px;top:15px;width:4px;height:10px;border-radius:2px;background:{{ limbD }};transform-origin:2px 1.5px;transform:{{ armLS }};animation:{{ armLA }}"></span>
        <sc-if value="{{ crown }}" hint-placeholder-val="{{ false }}">
          <span style="position:absolute;left:10px;top:5px;width:3px;height:5px;border-radius:1px;background:{{ col }}"></span>
          <span style="position:absolute;left:14.5px;top:2.5px;width:3px;height:7px;border-radius:1px;background:{{ top }}"></span>
          <span style="position:absolute;left:19px;top:5px;width:3px;height:5px;border-radius:1px;background:{{ col }}"></span>
        </sc-if>
        <sc-if value="{{ lead }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:14.5px;top:4.5px;width:3px;height:5px;border-radius:1px;background:{{ top }}"></span></sc-if>
        <span style="position:absolute;left:6px;top:9px;width:20px;height:20px;border-radius:6px 6px 7px 7px;background:{{ col }};box-shadow:inset -3px -3px 0 {{ shade }}"></span>
        <span style="position:absolute;left:9px;top:13px;width:14px;height:8px;border-radius:4px;background:#FFFFFF;overflow:hidden">
          <sc-if value="{{ eyesOpen }}" hint-placeholder-val="{{ true }}">
            <span style="position:absolute;left:3px;top:2.2px;width:2.5px;height:3.5px;border-radius:1.5px;background:#1F1D2B;transform:{{ eyeT }}"></span>
            <span style="position:absolute;left:8.5px;top:2.2px;width:2.5px;height:3.5px;border-radius:1.5px;background:#1F1D2B;transform:{{ eyeT }}"></span>
          </sc-if>
          <sc-if value="{{ eyesHappy }}" hint-placeholder-val="{{ false }}">
            <span style="position:absolute;left:2.5px;top:3px;width:4px;height:2.5px;box-sizing:border-box;border:1.2px solid #1F1D2B;border-bottom:0;border-radius:3px 3px 0 0"></span>
            <span style="position:absolute;left:8px;top:3px;width:4px;height:2.5px;box-sizing:border-box;border:1.2px solid #1F1D2B;border-bottom:0;border-radius:3px 3px 0 0"></span>
          </sc-if>
        </span>
        <span style="position:absolute;left:25px;top:15px;width:4px;height:10px;border-radius:2px;background:{{ limb }};transform-origin:2px 1.5px;transform:{{ armRS }};animation:{{ armRA }}"></span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:120,&quot;height&quot;:150},&quot;scale&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:3,&quot;min&quot;:0.5,&quot;max&quot;:6,&quot;tsType&quot;:&quot;number&quot;},&quot;col&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#E8643F&quot;,&quot;options&quot;:[&quot;#E8643F&quot;,&quot;#3F7FE0&quot;,&quot;#2BA3B8&quot;,&quot;#A45DB8&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;agent&quot;,&quot;lead&quot;,&quot;director&quot;],&quot;default&quot;:&quot;agent&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mood&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;idle&quot;,&quot;work&quot;,&quot;talk&quot;,&quot;think&quot;,&quot;happy&quot;,&quot;sad&quot;,&quot;hand&quot;],&quot;default&quot;:&quot;idle&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;walk&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;A&quot;,&quot;B&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;n&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3,&quot;tsType&quot;:&quot;number&quot;},&quot;face&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;r&quot;,&quot;l&quot;],&quot;default&quot;:&quot;r&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;frame&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;contact&quot;,&quot;down&quot;,&quot;pass&quot;,&quot;up&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;lit&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, k = p.scale ?? 1, col = p.col ?? '#E8643F', kind = p.kind ?? 'agent', mood = p.mood ?? 'idle', walk = p.walk || '', n = p.n ?? 3, fr = p.frame || '';
    const hx = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
    const mix = (t, f) => '#' + hx(col).map((v, i) => Math.round(v + (t[i] - v) * f).toString(16).padStart(2, '0')).join('');
    const walking = !!walk && !fr;
    const F = { contact: [26, -26, -22, 22, 'scale(1.04,.95)'], down: [13, -13, -11, 11, 'translateY(1px) scale(1.05,.94)'], pass: [0, 0, 0, 0, 'translateY(-3px) scale(.97,1.03)'], up: [-13, 13, 11, -11, 'translateY(-2px) scale(.98,1.02)'] }[fr];
    const arms = mood === 'hand' ? [8, -165] : mood === 'happy' ? [150, -150] : mood === 'sad' ? [3, -3] : mood === 'talk' ? [14, -26] : [8, -8];
    const r = d => 'rotate(' + d + 'deg)';
    const run = (nm, d) => nm + ' .56s ease-in-out ' + d + ' ' + n;
    return {
      w: (32 * k).toFixed(1) + 'px', h: (40 * k).toFixed(1) + 'px', k: String(k), col, top: mix([255, 255, 255], .3), shade: mix([0, 0, 0], .18), limb: mix([0, 0, 0], .32), limbD: mix([0, 0, 0], .45),
      lit: !!p.lit, crown: kind === 'director', lead: kind === 'lead',
      faceT: p.face === 'l' ? 'scaleX(-1)' : 'none',
      bodyS: F ? F[4] : mood === 'sad' ? 'rotate(4deg)' : 'none',
      bobA: walking ? run('wBob' + walk, '0s') : mood === 'happy' && !fr ? 'wHop .6s ease-out 3' : 'none',
      legLS: F ? r(F[0]) : 'none', legRS: F ? r(F[1]) : 'none',
      armLS: F ? r(F[2]) : r(arms[0]), armRS: F ? r(F[3]) : r(arms[1]),
      legLA: walking ? run('wLeg' + walk, '0s') : 'none', legRA: walking ? run('wLeg' + walk, '-.28s') : 'none',
      armLA: walking ? run('wArm' + walk, '-.28s') : mood === 'work' && !fr ? 'tWorkL .5s ease-in-out infinite' : 'none',
      armRA: walking ? run('wArm' + walk, '0s') : mood === 'work' && !fr ? 'tWorkR .5s ease-in-out .25s infinite' : 'none',
      eyesOpen: mood !== 'happy', eyesHappy: mood === 'happy',
      eyeT: mood === 'sad' ? 'translateY(2px)' : mood === 'think' ? 'translate(1px,-1px)' : mood === 'talk' ? 'translateX(1px)' : 'none'
    };
  }
}
</script>
</body>
</html>
