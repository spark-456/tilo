[project]
name = "tilo-providers"
version = "0.1.0"
description = "tilo_providers — model, search, safety, speech and render provider layer (PRD 6.4)"
requires-python = "==3.12.*"
dependencies = [
    "google-auth[requests]>=2.0",
    "google-cloud-texttospeech>=2.38.0",
    "google-genai>=1.0",
    "httpx>=0.27",
    "jsonschema>=4.18",
    "referencing>=0.30",
    "tilo-redact",
]

[tool.uv.sources]
tilo-redact = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tilo_providers"]
