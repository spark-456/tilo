[project]
name = "tilo-memory"
version = "0.1.0"
description = "tilo_memory — memory layers: result cache with freshness rules, fit check and Verifier before reuse (PRD 13.1)"
requires-python = "==3.12.*"
dependencies = ["tilo-contracts"]

[tool.uv.sources]
tilo-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tilo_memory"]
