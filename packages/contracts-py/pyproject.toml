[project]
name = "tilo-contracts"
version = "1.0.0"
description = "tilo_contracts: pydantic v2 models generated from contracts/ (src/ is generated; do not edit)"
requires-python = "==3.12.*"
dependencies = ["pydantic>=2.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tilo_contracts"]
