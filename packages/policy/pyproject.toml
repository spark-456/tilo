[project]
name = "tilo-policy"
version = "0.1.0"
description = "tilo_policy — deterministic policy engine: risk tiers, autonomy levels, gates (PRD 10.4)"
requires-python = "==3.12.*"
dependencies = ["pyyaml>=6.0", "jsonschema>=4.18", "referencing>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tilo_policy"]
