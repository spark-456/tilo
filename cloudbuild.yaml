# tilo-dev deploy on Google Cloud Build (P0-07f, PRD 6.3, 6.5). Same job as .github/workflows/deploy-dev.yml,
# run on Cloud Build instead of GitHub Actions minutes: build the service images from services/<svc>/Dockerfile
# (repo root as context), push them to Artifact Registry repo `tilo`, then swap each Cloud Run service
# `tilo-<svc>` to the pushed image BY DIGEST. Run it with `just deploy-dev-cloudbuild [service]`.
#
# Only the image, --min-instances 0 and --max-instances change here. Ingress, IAM, env vars, secrets and the
# runtime service accounts stay with Terraform (infra/modules/service ignores image changes). No keys and no
# secrets. The build runs as the dedicated service account tilo-cloudbuild (never the Compute Engine default or
# the legacy Cloud Build account), which holds five narrow roles (docs/deploy-dev.md). Until the separate
# Terraform PR creates that account, a submitted build fails before any step runs. tilo-dev only.
#
# Substitutions: $PROJECT_ID, $BUILD_ID are built in; _SERVICE is the only user substitution (all, or one of
# the seven short names). Shell variables are written $$name so Cloud Build leaves them to the shell.
# Builder images are pinned by tag; bump the tags on purpose and record them in docs/licences.md.
timeout: 2700s # 45 minutes, the cost cap the Actions workflow uses
serviceAccount: projects/$PROJECT_ID/serviceAccounts/tilo-cloudbuild@$PROJECT_ID.iam.gserviceaccount.com
options:
  logging: CLOUD_LOGGING_ONLY # required with a user-specified service account; no logs bucket to create or pay for

substitutions:
  _SERVICE: all

steps:
  - id: select-services
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:587.0.0
    entrypoint: bash
    env:
      - SELECTED=$_SERVICE # reaches the script as data, never spliced into it
    args:
      - -c
      - |
        set -euo pipefail
        mkdir /workspace/tilo-run
        case "$$SELECTED" in
          all) list="api harness channels connectors browser render sandbox-web" ;;
          api|harness|channels|connectors|browser|render|sandbox-web) list="$$SELECTED" ;;
          *) echo "unknown service" >&2; exit 1 ;;
        esac
        echo "$$list" > /workspace/tilo-run/services.txt
        echo "deploying: $$list"

  - id: build-and-push
    name: gcr.io/cloud-builders/docker:20.10.24
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        for svc in $$(cat /workspace/tilo-run/services.txt); do
          image="asia-southeast1-docker.pkg.dev/$PROJECT_ID/tilo/$${svc}:$BUILD_ID"
          docker build --file "services/$${svc}/Dockerfile" --tag "$$image" .
          docker push "$$image"
          docker inspect --format '{{index .RepoDigests 0}}' "$$image" > "/workspace/tilo-run/digest-$${svc}"
        done

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:587.0.0
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        update() {  # update <svc> <extra flags>: swap the image only; Terraform owns everything else
          svc="$$1"; shift
          [ -f "/workspace/tilo-run/digest-$${svc}" ] || return 0
          digest_ref=$$(cat "/workspace/tilo-run/digest-$${svc}")
          case "$$digest_ref" in
            "asia-southeast1-docker.pkg.dev/$PROJECT_ID/tilo/$${svc}@sha256:"*) ;;
            *) echo "refusing to deploy $${svc}: not a pushed digest of its image" >&2; exit 1 ;;
          esac
          gcloud run services update "tilo-$${svc}" --project "$PROJECT_ID" --region asia-southeast1 \
            --image "$$digest_ref" --min-instances 0 "$$@" --quiet
        }
        update api --max-instances 3
        update harness --max-instances 3
        update channels --max-instances 3
        update connectors --max-instances 1
        update browser --max-instances 2
        update render --max-instances 2
        update sandbox-web --max-instances 2
