repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: detect-private-key
      - id: check-added-large-files

  # ruff runs from uv.lock, the same version `just check` uses, so the hook and the gate never
  # disagree on formatting (a separately pinned ruff 0.7.4 used to reformat what 0.16 accepts).
  - repo: local
    hooks:
      - id: ruff
        name: ruff check (locked version)
        entry: uv run --no-sync ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format (locked version)
        entry: uv run --no-sync ruff format --force-exclude
        language: system
        types_or: [python, pyi]
      - id: secret-scan
        name: secret scan (staged files)
        entry: python scripts/secret_scan.py
        language: system
        pass_filenames: true
