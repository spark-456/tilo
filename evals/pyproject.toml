[project]
name = "tilo-evals"
version = "0.1.0"
description = "tilo_evals — the eval harness: case schema, runner, deterministic checks, credit caps (EFF-07, PRD 19)"
requires-python = "==3.12.*"
dependencies = ["pyyaml>=6.0", "jsonschema>=4.18"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tilo_evals"]
