title: Repositioning pack for a textiles brand (long brief)
brief: 'Background: Fennel & Co. sells reusable kitchen textiles, founded by two sisters in 2019, mostly through
  its own site and two craft fairs a year. Our customers are home cooks aged 28 to 55 who care about waste. We are
  repositioning from ''cute and handmade'' to ''built to last, repairable for life''. Background: Fennel & Co. sells
  reusable kitchen textiles, founded by two sisters in 2019, mostly through its own site and two craft fairs a year.
  Our customers are home cooks aged 28 to 55 who care about waste. We are repositioning from ''cute and handmade''
  to ''built to last, repairable for life''. Background: Fennel & Co. sells reusable kitchen textiles, founded by
  two sisters in 2019, mostly through its own site and two craft fairs a year. Our customers are home cooks aged
  28 to 55 who care about waste. We are repositioning from ''cute and handmade'' to ''built to last, repairable
  for life''. Background: Fennel & Co. sells reusable kitchen textiles, founded by two sisters in 2019, mostly through
  its own site and two craft fairs a year. Our customers are home cooks aged 28 to 55 who care about waste. We are
  repositioning from ''cute and handmade'' to ''built to last, repairable for life''. Background: Fennel & Co. sells
  reusable kitchen textiles, founded by two sisters in 2019, mostly through its own site and two craft fairs a year.
  Our customers are home cooks aged 28 to 55 who care about waste. We are repositioning from ''cute and handmade''
  to ''built to last, repairable for life''. Please produce (1) a one-page positioning statement, (2) a messaging
  grid with three audiences and three claims each, and (3) a list of ten proof points we can honestly make today.
  Constraints: no superlatives we cannot back up, no claims about sustainability certifications we do not hold,
  British spelling.'
