# Tilo event registry v1 (PRD 9.5, FR-WLD-03). Shape: registry.schema.json; rules: ../event.rules.md.
#
# Every type the harness may emit is listed here with exactly one world effect, one HUD effect,
# one Story line template and one Trace row, its data schema, its valid fixture and the pillar
# whose logic emits it. The harness never emits a type that is not listed (EV-01).
#
# Unknown types (HR-5): a consumer that meets a type it does not know (for example from a newer
# harness) shows it in the Trace lens only; the world and the HUD never animate it and the Story
# lens skips it. `unknown_types: trace_only` states this as data.
#
# Templates: {actor} and {target} become display names from the world layout (the id when there
# is none); {data.<field>} is a required field of the type's data schema (contracts-check fails
# otherwise). trace_row is the type-specific Detail column; the other Trace columns (seq, ts,
# type, actor, target, severity, credits, authz, model profile, tokens, latency, archive link,
# cause) are the same for every type. hud_effect "none" means the HUD does not change.
#
# side_effect: true marks a type that records a side effect or the decision that authorises one
# (PRD 10.4 Audit, HR-7). Such an event carries authz (EV-03) from one of authz_by (EV-04), and
# event.schema.json lists the same types (contracts-check fails if the lists drift).

