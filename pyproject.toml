[project]
name = "tilo"
version = "0.1.0"
description = "Tilo monorepo root — uv workspace"
requires-python = "==3.12.*"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "jsonschema>=4.18",
    "referencing>=0.30",
    "datamodel-code-generator>=0.83.0",
]

[tool.uv.workspace]
members = ["services/api", "services/harness", "services/sandbox-web", "packages/providers", "packages/contracts-py", "packages/policy", "packages/metering", "evals", "services/connectors", "packages/archive", "packages/memory", "packages/planning", "packages/world", "services/render", "services/channels", "services/browser", "packages/people", "packages/logging"]

[tool.pytest.ini_options]
markers = [
    "system: starts real service processes and drives them over HTTP (tests/system); `just system-test`, not in `just test`.",
    "slow: exercises a real subprocess (e.g. `just contracts-check` on a temp copy); still runs in `just check`, just not instantaneous.",
]

[tool.ruff]
line-length = 120
target-version = "py312"
# Generated contract types (FR-WLD-02) are checked for drift by `just contracts-check`, not linted.
extend-exclude = [".claude", "packages/contracts-py/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# services/api/tests has no __init__.py (pytest's rootdir-relative sibling imports need that), so
# its conftest.py collides with packages/providers/tests/conftest.py as a duplicate top-level
# module once both are checked in one mypy invocation; excluding it here is narrower than adding
# an __init__.py, which would break those sibling imports.
exclude = ["services/api/tests/conftest\\.py$"]
