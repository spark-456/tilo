[project]
name = "tilo"
version = "0.1.0"
description = "Tilo monorepo root — uv workspace"
requires-python = "==3.12.*"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "jsonschema>=4.18",
    "referencing>=0.30",
    "datamodel-code-generator>=0.83.0",
]

[tool.uv.workspace]
members = ["services/api", "services/harness", "packages/providers", "packages/contracts-py", "packages/policy", "packages/metering", "evals", "services/connectors"]

[tool.pytest.ini_options]
markers = [
    "slow: exercises a real subprocess (e.g. `just contracts-check` on a temp copy); still runs in `just check`, just not instantaneous.",
]

[tool.ruff]
line-length = 120
target-version = "py312"
# Generated contract types (FR-WLD-02) are checked for drift by `just contracts-check`, not linted.
extend-exclude = [".claude", "packages/contracts-py/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# `services/api` and `packages/providers` are the only typecheck targets that recurse into a
# `tests/` dir (every other target is `.../src`), so their `conftest.py`s are the only ones ever
# handed to mypy without an `__init__.py` -- and both are named `conftest.py`, which mypy (run
# without `--explicit-package-bases`) rejects as a duplicate top-level module the moment both
# targets are checked in one invocation. Adding `__init__.py` would fix mypy but breaks pytest's
# rootdir-relative sibling imports (e.g. `from _api_lib import ...`) in those same directories, so
# excluding `conftest.py` from static typing (pytest still collects and runs it as normal) is the
# narrower fix.
exclude = ["conftest\\.py$"]
