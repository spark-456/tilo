id: price-comparison
version: 0.1.0
domain: commerce
author: Tilo build (drafted by Claude Code)
reviewer: Pending domain expert review
tools_allowed:
  - web_search
  - read_page
  - read_file
inputs:
  type: object
  additionalProperties: false
  required:
    - item
    - requirements
    - currency
    - rates
    - offers
  properties:
    item:
      type: string
      minLength: 1
    requirements:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
          - field
          - op
          - value
        properties:
          field:
            type: string
          op:
            type: string
            enum: [eq, gte, lte, gt, lt, in]
          value: {}
    currency:
      type: string
      minLength: 1
    rates:
      type: object
      additionalProperties:
        type: number
    offers:
      type: array
      minItems: 1
      items:
        type: object
        additionalProperties: true
        required:
          - offer_id
          - source_id
          - price
          - currency
          - unit_count
        properties:
          offer_id:
            type: string
          source_id:
            type: string
          price:
            type: number
          currency:
            type: string
          unit_count:
            type: number
outputs:
  type: object
  additionalProperties: false
  required:
    - unit_prices
    - pick
  properties:
    unit_prices:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
          - offer_id
          - unit_price
          - currency
          - source_id
        properties:
          offer_id:
            type: string
          unit_price:
            type: number
          currency:
            type: string
          source_id:
            type: string
    pick:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - offer_id
            - source_id
          properties:
            offer_id:
              type: string
            source_id:
              type: string
        - type: "null"
description: Compare offers for one item, normalise to a unit price, and pick the cheapest that meets every requirement.
