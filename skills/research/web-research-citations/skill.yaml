id: web-research-citations
version: 0.1.0
domain: research
author: Tilo build (drafted by Claude Code)
reviewer: Pending domain expert review
tools_allowed:
  - web_search
  - read_page
inputs:
  type: object
  additionalProperties: false
  required:
    - question
    - sources
  properties:
    question:
      type: string
      minLength: 1
      maxLength: 2000
    sources:
      type: array
      minItems: 1
      maxItems: 50
      items:
        type: object
        additionalProperties: false
        required:
          - id
          - url
          - text
          - safety_flags
        properties:
          id:
            type: string
            minLength: 1
            maxLength: 64
          url:
            type: string
            maxLength: 2000
          text:
            type: string
            maxLength: 20000
          safety_flags:
            description: Per-source flags from the SafetyProvider (PRD 16.3 point 2); empty means clean.
            type: array
            maxItems: 20
            items:
              type: string
              minLength: 1
              maxLength: 64
outputs:
  type: object
  additionalProperties: false
  required:
    - claims
    - flagged_sources
  properties:
    claims:
      type: array
      maxItems: 100
      items:
        type: object
        additionalProperties: false
        required:
          - text
          - source_ids
        properties:
          text:
            type: string
            minLength: 1
            maxLength: 2000
          source_ids:
            type: array
            minItems: 1
            maxItems: 20
            items:
              type: string
              maxLength: 64
    flagged_sources:
      type: array
      maxItems: 50
      items:
        type: string
        maxLength: 64
description: Answer a question from supplied sources, citing every claim and reporting exactly which sources the SafetyProvider flagged.
