id: "quiz-assessment"
version: "1.0.0"
domain: "research"
author: "Northbridge Assessment Team"
reviewer: "Research Domain Expert"
tools_allowed: []
inputs:
  type: object
  additionalProperties: false
  required: ["quiz_title", "questions", "responses"]
  properties:
    quiz_title: { type: string, minLength: 1 }
    questions:
      type: array
      minItems: 1
      items:
        type: object
        additionalProperties: false
        required: ["id", "topic", "answer", "source"]
        properties:
          id: { type: string, pattern: "^q[1-9][0-9]{0,2}$" }
          topic: { type: string, pattern: "^[a-z][a-z0-9_]{0,63}$" }
          answer: { type: string, enum: ["a", "b", "c", "d", "e", "f"] }
          source:
            type: object
            additionalProperties: false
            required: ["artifact", "page"]
            properties:
              artifact:
                type: object
                additionalProperties: false
                required: ["artifact_id", "version"]
                properties:
                  artifact_id: { type: string, pattern: "^art_[0-9A-Za-z_]{1,48}$" }
                  version: { type: integer, minimum: 1 }
              page: { type: integer, minimum: 1 }
    responses:
      type: array
      items:
        type: object
        additionalProperties: false
        required: ["question_id", "selected"]
        properties:
          question_id: { type: string, pattern: "^q[1-9][0-9]{0,2}$" }
          selected:
            anyOf:
              - type: "null"
              - { type: string, enum: ["a", "b", "c", "d", "e", "f"] }
outputs:
  type: object
  additionalProperties: false
  required: ["score", "topic_breakdown", "weak_topics", "next_practice_set", "summary"]
  properties:
    score:
      type: object
      additionalProperties: false
      required: ["correct", "total", "accuracy_pct"]
      properties:
        correct: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 1 }
        accuracy_pct: { type: number, minimum: 0, maximum: 100 }
    topic_breakdown:
      type: array
      minItems: 1
      items:
        type: object
        additionalProperties: false
        required: ["topic", "correct", "total", "accuracy_pct", "status"]
        properties:
          topic: { type: string, pattern: "^[a-z][a-z0-9_]{0,63}$" }
          correct: { type: integer, minimum: 0 }
          total: { type: integer, minimum: 1 }
          accuracy_pct: { type: number, minimum: 0, maximum: 100 }
          status: { type: string, enum: ["strong", "needs_practice", "weak"] }
    weak_topics:
      type: array
      items: { type: string, pattern: "^[a-z][a-z0-9_]{0,63}$" }
    next_practice_set:
      type: array
      minItems: 1
      items:
        type: object
        additionalProperties: false
        required: ["topic", "recommended_count", "focus_note", "source_refs"]
        properties:
          topic: { type: string, pattern: "^[a-z][a-z0-9_]{0,63}$" }
          recommended_count: { type: integer, minimum: 1, maximum: 50 }
          focus_note: { type: string, minLength: 1 }
          source_refs:
            type: array
            minItems: 1
            items:
              type: object
              additionalProperties: false
              required: ["artifact_id", "version", "page"]
              properties:
                artifact_id: { type: string, pattern: "^art_[0-9A-Za-z_]{1,48}$" }
                version: { type: integer, minimum: 1 }
                page: { type: integer, minimum: 1 }
    summary: { type: string, minLength: 1 }
description: "Produce a scored diagnostic with weak topics, next practice set, and summary from quiz attempts."
