id: "question-bank-extraction"
version: "1.0.0"
domain: "research"
author: "Northbridge Curriculum Team"
reviewer: "Research Domain Expert"
tools_allowed: []
inputs:
  type: object
  additionalProperties: false
  required: ["parts"]
  properties:
    parts:
      type: array
      minItems: 1
      items:
        type: object
        additionalProperties: false
        required: ["artifact", "role", "pages"]
        properties:
          artifact:
            type: object
            additionalProperties: false
            required: ["artifact_id", "version"]
            properties:
              artifact_id: { type: string, pattern: "^art_[0-9A-Za-z_]{1,48}$" }
              version: { type: integer, minimum: 1 }
          role: { type: string, enum: ["question_paper", "answer_key"] }
          pages:
            type: array
            minItems: 1
            items:
              type: object
              additionalProperties: false
              required: ["page", "text"]
              properties:
                page: { type: integer, minimum: 1 }
                text: { type: string, minLength: 1 }
outputs:
  type: object
  additionalProperties: false
  required: ["questions"]
  properties:
    questions:
      type: array
      minItems: 1
      items:
        type: object
        additionalProperties: false
        required: ["id", "stem", "options", "answer", "answer_source", "topic", "source"]
        properties:
          id: { type: string, pattern: "^q[1-9][0-9]{0,2}$" }
          stem: { type: string, minLength: 1, maxLength: 2000 }
          options:
            type: object
            additionalProperties: false
            required: ["a", "b", "c", "d"]
            properties:
              a: { type: string, minLength: 1, maxLength: 500 }
              b: { type: string, minLength: 1, maxLength: 500 }
              c: { type: string, minLength: 1, maxLength: 500 }
              d: { type: string, minLength: 1, maxLength: 500 }
          answer: { type: string, enum: ["a", "b", "c", "d", "unknown"] }
          answer_source:
            anyOf:
              - type: "null"
              - type: object
                additionalProperties: false
                required: ["artifact", "page"]
                properties:
                  artifact:
                    type: object
                    additionalProperties: false
                    required: ["artifact_id", "version"]
                    properties:
                      artifact_id: { type: string, pattern: "^art_[0-9A-Za-z_]{1,48}$" }
                      version: { type: integer, minimum: 1 }
                  page: { type: integer, minimum: 1 }
          topic: { type: string, pattern: "^[a-z][a-z0-9_]{0,63}$" }
          source:
            type: object
            additionalProperties: false
            required: ["artifact", "page"]
            properties:
              artifact:
                type: object
                additionalProperties: false
                required: ["artifact_id", "version"]
                properties:
                  artifact_id: { type: string, pattern: "^art_[0-9A-Za-z_]{1,48}$" }
                  version: { type: integer, minimum: 1 }
              page: { type: integer, minimum: 1 }
description: "Extract 4-option MCQs with topic tags, source pages, and printed answers from PDF parts."
