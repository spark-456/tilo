id: table-extraction
version: 0.1.0
domain: research
author: Tilo build (drafted by Claude Code)
reviewer: Pending domain expert review
tools_allowed:
  - read_file
  - parse_table
inputs:
  type: object
  additionalProperties: false
  required:
    - table
  properties:
    table:
      type: object
      additionalProperties: false
      required:
        - rows
      properties:
        rows:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required:
              - row_ref
              - cells
            properties:
              row_ref:
                type: string
                minLength: 1
                maxLength: 64
              cells:
                type: object
                maxProperties: 50
                additionalProperties:
                  type: string
                  maxLength: 2000
outputs:
  type: object
  additionalProperties: false
  required:
    - records
  properties:
    records:
      type: array
      maxItems: 500
      items:
        type: object
        additionalProperties: false
        required:
          - row_ref
          - fields
        properties:
          row_ref:
            type: string
            maxLength: 64
          fields:
            type: object
            maxProperties: 50
            additionalProperties:
              type: object
              additionalProperties: false
              required:
                - cell
                - value
              properties:
                cell:
                  type: string
                  maxLength: 64
                value:
                  oneOf:
                    - type: string
                      maxLength: 2000
                    - type: number
description: Turn a supplied table into typed records, keeping every value traceable to its own cell.
