id: invoice-po-matching
version: 0.1.0
domain: finance
author: Tilo build (drafted by Claude Code)
reviewer: Pending domain expert review
tools_allowed:
  - read_file
  - read_invoice
  - read_purchase_order
inputs:
  type: object
  additionalProperties: false
  required:
    - invoice_lines
    - po_lines
  properties:
    invoice_lines:
      type: array
      minItems: 1
      maxItems: 200
      items:
        type: object
        additionalProperties: false
        required:
          - line_id
          - amount
          - description
        properties:
          line_id:
            type: string
            maxLength: 64
          amount:
            type: number
          description:
            type: string
            maxLength: 500
    po_lines:
      type: array
      minItems: 1
      maxItems: 200
      items:
        type: object
        additionalProperties: false
        required:
          - line_id
          - amount
          - description
        properties:
          line_id:
            type: string
            maxLength: 64
          amount:
            type: number
          description:
            type: string
            maxLength: 500
outputs:
  type: object
  additionalProperties: false
  required:
    - matches
    - totals
  properties:
    matches:
      type: array
      maxItems: 400
      items:
        type: object
        additionalProperties: false
        required:
          - invoice_line_id
          - po_line_id
          - status
          - reason_code
        properties:
          invoice_line_id:
            oneOf:
              - type: string
                maxLength: 64
              - type: "null"
          po_line_id:
            oneOf:
              - type: string
                maxLength: 64
              - type: "null"
          status:
            type: string
            enum:
              - matched
              - mismatched
              - unmatched
          reason_code:
            oneOf:
              - type: string
                enum:
                  - amount_mismatch
                  - description_mismatch
              - type: "null"
    totals:
      type: object
      additionalProperties: false
      required:
        - invoice_total
        - po_total
      properties:
        invoice_total:
          type: number
        po_total:
          type: number
description: Match invoice lines to purchase-order lines and recompute totals; matching only, no side effect.
