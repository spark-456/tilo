id: verification-checklist
version: 0.1.0
domain: quality
author: Tilo build (drafted by Claude Code)
reviewer: Pending domain expert review
tools_allowed:
  - read_file
  - read_artifact
inputs:
  type: object
  additionalProperties: false
  required:
    - deliverable_claims
    - evidence
  properties:
    deliverable_claims:
      type: array
      minItems: 1
      maxItems: 100
      items:
        type: object
        additionalProperties: false
        required:
          - claim_id
          - text
        properties:
          claim_id:
            type: string
            maxLength: 64
          text:
            type: string
            maxLength: 2000
    evidence:
      type: array
      maxItems: 100
      items:
        type: object
        additionalProperties: false
        required:
          - source_id
          - text
        properties:
          source_id:
            type: string
            maxLength: 64
          text:
            type: string
            maxLength: 2000
outputs:
  type: object
  additionalProperties: false
  required:
    - verdicts
  properties:
    verdicts:
      type: array
      maxItems: 100
      items:
        type: object
        additionalProperties: false
        required:
          - claim_id
          - verdict
          - evidence_source_ids
        properties:
          claim_id:
            type: string
            maxLength: 64
          verdict:
            type: string
            enum:
              - verified
              - unverified
              - "false"
          evidence_source_ids:
            type: array
            maxItems: 20
            items:
              type: string
              maxLength: 64
description: Give every claim in a deliverable a verified/unverified/false verdict with evidence ids, dropping nothing.
