id: email-triage
version: 0.1.0
domain: email
author: Tilo build (drafted by Claude Code)
reviewer: Pending domain expert review
tools_allowed:
  - read_email
inputs:
  type: object
  additionalProperties: false
  required:
    - messages
  properties:
    messages:
      type: array
      minItems: 1
      maxItems: 200
      items:
        type: object
        additionalProperties: false
        required:
          - id
          - from
          - subject
          - body
          - safety_flags
        properties:
          id:
            type: string
            minLength: 1
            maxLength: 128
          from:
            type: string
            maxLength: 254
          subject:
            type: string
            maxLength: 998
          body:
            type: string
            maxLength: 20000
          safety_flags:
            description: Per-message flags from the SafetyProvider (PRD 16.3 point 2); empty means clean.
            type: array
            maxItems: 20
            items:
              type: string
              minLength: 1
              maxLength: 64
    vip_senders:
      type: array
      maxItems: 200
      items:
        type: string
        maxLength: 254
outputs:
  type: object
  additionalProperties: false
  required:
    - triage
  properties:
    triage:
      type: array
      maxItems: 200
      items:
        type: object
        additionalProperties: false
        required:
          - message_id
          - category
          - priority
        properties:
          message_id:
            type: string
            minLength: 1
            maxLength: 128
          category:
            type: string
            enum:
              - needs_reply
              - needs_action
              - fyi
              - newsletter_promotion
              - suspicious
          priority:
            type: integer
            minimum: 0
            maximum: 100
description: Triage a batch of emails into a category and priority, using the SafetyProvider's per-message flags, never content sniffing.
