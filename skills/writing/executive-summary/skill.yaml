id: executive-summary
version: 0.1.0
domain: writing
author: Tilo build (drafted by Claude Code)
reviewer: Pending domain expert review
tools_allowed:
  - read_file
  - read_artifact
inputs:
  type: object
  additionalProperties: false
  required:
    - question
    - material
    - max_words
  properties:
    question:
      type: string
      minLength: 1
    material:
      type: array
      minItems: 1
      items:
        type: object
        additionalProperties: false
        required:
          - source_id
          - text
        properties:
          source_id:
            type: string
          text:
            type: string
    max_words:
      type: integer
      minimum: 1
outputs:
  type: object
  additionalProperties: false
  required:
    - answer_first
    - claims
  properties:
    answer_first:
      type: string
      minLength: 1
    claims:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
          - text
          - source_id
        properties:
          text:
            type: string
          source_id:
            type: string
description: Write a sourced executive summary that leads with the answer, within a word limit.
