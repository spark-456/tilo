id: deck-writing
version: 0.1.0
domain: writing
author: Tilo build (drafted by Claude Code)
reviewer: Pending domain expert review
tools_allowed:
  - read_file
  - read_artifact
inputs:
  type: object
  additionalProperties: false
  required:
    - material
    - max_slides
  properties:
    material:
      type: array
      minItems: 1
      maxItems: 50
      items:
        type: object
        additionalProperties: false
        required:
          - source_id
          - text
        properties:
          source_id:
            type: string
            maxLength: 64
          text:
            type: string
            maxLength: 20000
    max_slides:
      type: integer
      minimum: 1
      maximum: 50
outputs:
  type: object
  additionalProperties: false
  required:
    - slides
  properties:
    slides:
      type: array
      maxItems: 50
      items:
        type: object
        additionalProperties: false
        required:
          - title
          - bullets
        properties:
          title:
            type: string
            maxLength: 60
          bullets:
            type: array
            maxItems: 20
            items:
              type: object
              additionalProperties: false
              required:
                - text
              properties:
                text:
                  type: string
                  maxLength: 500
                source_id:
                  type: string
                  maxLength: 64
          source_refs:
            type: array
            maxItems: 20
            items:
              type: string
              maxLength: 64
          charts:
            description: Charts are data references to material ids, never model-drawn images (PRD 12.4).
            type: array
            maxItems: 5
            items:
              type: object
              additionalProperties: false
              required:
                - source_id
              properties:
                source_id:
                  type: string
                  maxLength: 64
                chart_type:
                  type: string
                  maxLength: 32
description: Outline slides from verified material with sourced numbers and chart references, never model-drawn charts.
