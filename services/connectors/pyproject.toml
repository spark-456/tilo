[project]
name = "tilo-connectors"
version = "0.1.0"
description = "tilo_connectors — outbox, OAuth token broker, Gmail/Drive adapters (PRD 6.2, 12.1)"
requires-python = "==3.12.*"
dependencies = ["tilo-policy", "jsonschema>=4.18", "referencing>=0.30", "pyyaml>=6.0"]

[tool.uv.sources]
tilo-policy = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tilo_connectors"]
