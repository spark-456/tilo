[project]
name = "tilo-connectors"
version = "0.1.0"
description = "tilo_connectors — outbox, OAuth token broker, Gmail/Drive adapters (PRD 6.2, 12.1)"
requires-python = "==3.12.*"
dependencies = ["tilo-policy", "tilo-archive", "tilo-contracts", "jsonschema>=4.18", "referencing>=0.30", "pyyaml>=6.0", "cryptography>=42", "fastapi>=0.115", "uvicorn>=0.32", "tzdata>=2024.1", "google-cloud-firestore>=2.20.0", "google-cloud-kms>=3.0", "google-auth>=2.30"]

[tool.uv.sources]
tilo-policy = { workspace = true }
tilo-archive = { workspace = true }
tilo-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tilo_connectors"]
