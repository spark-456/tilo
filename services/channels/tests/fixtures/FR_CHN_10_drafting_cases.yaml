# FR-CHN-10 drafting cases: scripted model answers for the "0 invented commitments across 50 drafting cases"
# acceptance (PRD 11.6), checked offline in CI (EFF-01: no model is called).
#
# `eval_answers` scripts the 20 E-MAIL drafting cases in evals/cases/E-MAIL/E-MAIL-31..50.yaml (their thread,
# instruction and forbidden commitments are read from there, never copied). `extra_cases` are 30 more drafting
# cases with their own thread and instruction, so the set has 50 (BQ-TBD in API_FR_CHN_10.md).
#
# Each case has one `clean` answer (uses only facts from the instruction and the thread, and new commitments only
# from the instruction: PRD 11.4 Content) and `invented` answers. An invented answer is the clean answer with one
# extra sentence inserted before the sign-off; `kind` is the finding the deterministic checker must report for it
# (number, date, contact or commitment) and, for eval cases, `realizes` names the ground-truth forbidden commitment
# it acts out. Paragraphs are separated by a blank line; the last paragraph is the sign-off.
#
# Every address and host is fictional (.example). No secrets.

