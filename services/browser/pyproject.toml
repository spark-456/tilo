[project]
name = "tilo-browser"
version = "0.1.0"
description = "tilo_browser — cloud browser workers: egress allowlist, masking, login walls (PRD 6.2, 12.3)"
requires-python = "==3.12.*"
dependencies = ["tilo-providers", "idna>=3.7", "fastapi>=0.115", "uvicorn>=0.32"]

[tool.uv.sources]
tilo-providers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tilo_browser"]
