[project]
name = "tilo-harness"
version = "0.1.0"
description = "tilo_harness — the single writer per world: a Google ADK agent app, event validation and Firestore stores (PRD 6.2, 8.1, 9.3-9.5, 15.3)"
requires-python = "==3.12.*"
dependencies = [
    "google-adk>=1.17.0",
    "google-cloud-firestore>=2.20.0",
    "pyyaml>=6.0",
    "jsonschema>=4.18",
    "referencing>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tilo_harness"]
