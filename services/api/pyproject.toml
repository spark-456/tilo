[project]
name = "tilo-api"
version = "0.1.0"
description = "tilo-api — sessions, tasks, cards, approvals, policies (PRD 6.2)"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyyaml>=6.0",
    "jsonschema>=4.18",
    "referencing>=0.30",
    "python-multipart>=0.0.18",
    "tilo-planning",
    "tilo-policy",
    "tilo-harness",
    "tilo-connectors",
    "tilo-metering",
    "tilo-world",
]

[tool.uv.sources]
tilo-planning = { workspace = true }
tilo-policy = { workspace = true }
tilo-harness = { workspace = true }
tilo-connectors = { workspace = true }
tilo-metering = { workspace = true }
tilo-world = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tilo_api"]
