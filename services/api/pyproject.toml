[project]
name = "tilo-api"
version = "0.1.0"
description = "tilo-api — sessions, tasks, cards, approvals, policies (PRD 6.2)"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyyaml>=6.0",
    "python-multipart>=0.0.18",
    "tilo-planning",
]

[tool.uv.sources]
tilo-planning = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tilo_api"]
