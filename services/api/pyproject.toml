[project]
name = "tilo-api"
version = "0.1.0"
description = "tilo-api — sessions, tasks, cards, approvals, policies (PRD 6.2)"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyyaml>=6.0",
    "jsonschema>=4.18",
    "referencing>=0.30",
    "python-multipart>=0.0.18",
    "google-auth>=2.30",
    "google-cloud-firestore>=2.20.0",
    "google-cloud-storage>=2.18",
    "requests>=2.31",
    "cryptography>=42",
    "tilo-planning",
    "tilo-policy",
    "tilo-harness",
    "tilo-browser",
    "tilo-connectors",
    "tilo-metering",
    "tilo-world",
    "tilo-archive",
    "tilo-memory",
    "tilo-people",
    "tilo-channels",
    "tilo-logging",
    "tilo-redact",
]

[tool.uv.sources]
tilo-archive = { workspace = true }
tilo-logging = { workspace = true }
tilo-memory = { workspace = true }
tilo-people = { workspace = true }
tilo-channels = { workspace = true }
tilo-redact = { workspace = true }
tilo-planning = { workspace = true }
tilo-policy = { workspace = true }
tilo-harness = { workspace = true }
tilo-browser = { workspace = true }
tilo-connectors = { workspace = true }
tilo-metering = { workspace = true }
tilo-world = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tilo_api"]
