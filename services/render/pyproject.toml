[project]
name = "tilo-render"
version = "0.1.0"
description = "tilo_render: PDF and PPTX deliverables from templates with data-bound charts (PRD 12.4, FR-CON-09)"
requires-python = "==3.12.*"
dependencies = [
    "pydantic>=2.13.5",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tilo_render"]
