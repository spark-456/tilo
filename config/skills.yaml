# Taught skills (FR-SKL-04, ADR-0034, contracts/taught_skill.rules.md TS-05, TS-07).
# Read by tilo_api.skills_routes.load_skill_config; a missing or unusable file falls back to the same numbers there.
# No model id belongs here. Only what the store and routes need today; the trust, try-run, capture and helpers keys
# of the ADR arrive with the tickets that read them (trust.good_runs is read by skills_feedback.py).

# Estimates before a skill has runs of its own (source "prior"): per step, worked out by code. These are
# placeholders until measured from replay (BQ-SKILLS-1); prices_as_of is read from config/prices.yaml.
prior:
  credits_per_step: 3
  seconds_per_step: 20

# TS-08, FR-SKL-06: verified, deduplicated up-rated finished runs a skill needs before its owner may mark it trusted.
trust:
  good_runs: 5

# TS-07: an event trigger's type must be on this list (and registered); the runner's daily cap is a later slice.
triggers:
  event_types: [meeting.minuted, work_item.created, world.completed]

# FR-SKL-02, TS-20 (ADR-0051 decision A): the tools a taught step may use, connector -> actions. A step the model
# proposes outside this list, or that config/connectors.yaml does not declare, is dropped to "Tilo can't do this yet"
# (the declared-only rule is code, never the model). browse_web stays unusable until config/connectors.yaml declares it
# (ticket B1c); render outputs arrive with their own ticket. No model id belongs here.
# SKILL-ROUTE (FR-SKL-04, EFF-04): which skill fits a task. A task is embedded with the `embed` role and compared (cosine)
# with the description of each skill the person may use. min_score is the least score that counts as a match; when the
# top two are within tie_margin one cheap assistant call picks between them. dimensions is the embedding size. The
# numbers are a starting point to tune against real embeddings (BQ-SKILLROUTE-1). No model id belongs here.
route:
  min_score: 0.75
  tie_margin: 0.02
  dimensions: 256

capture:
  # S2 (ADR-0051, TS-03): limits for a recording or file. The web recorder reads max_recording_seconds; the server
  # keeps at most max_file_bytes (under Cloud Run's 32 MiB HTTP/1 request limit; the store's own cap is 50,000,000) and reads at most max_read_bytes (the providers' 10 MiB inline part).
  max_steps: 20
  max_recording_seconds: 300
  max_file_bytes: 30000000
  max_read_bytes: 10485760
  # P0-SKILLS-TEACH: when the model gives nothing usable, a step of the person's own words is bound to a read pair of a
  # connected tool by these words (else it is a text step). Reads only; a send, post or save is never chosen by code.
  fallback:
    gmail: {action: search_email, words: [email, emails, mail, gmail, inbox, unread, messages]}
    google_calendar: {action: read_events, words: [calendar, meeting, meetings, events, agenda, schedule]}
    google_drive: {action: list_files, words: [drive, folder, files, documents, spreadsheet]}
    web: {action: web_search, words: [web, website, search, news, online, internet, research, google]}
  tools:
    gmail: [read_email, search_email, create_draft, send_email]
    google_drive: [read_file, list_files, save_file, save_as_google_file]
    google_calendar: [read_events, create_event, create_event_with_guests]
    web: [web_search, fetch_url, browse_web]
    slack: [read_slack]
    notion: [read_notion]
    github: [read_github]
    xero: [read_xero]
    hubspot: [read_hubspot]
    stripe: [read_stripe]
    microsoft365: [read_microsoft365]
    jira: [read_jira]
    bamboohr: [read_bamboohr]
