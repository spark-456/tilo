# The meeting bot's voice (FR-MTG-11): text to speech through SpeechProvider.synthesize. Read by
# tilo_providers.voice.load_voice_config; a vendor other than google-cloud-tts, google or fake, a denylisted model id (the
# rules.deny list in config/models.yaml, PL-07), a bad voice name, an unknown sample rate, a bad region or timeout, or a
# non-positive cap fails start-up loudly. The voice and model ids appear only here and in packages/providers (PL-01). A
# Google voice speaks only with the live switch, which only the user sets (EFF-01); dev and CI read
# config/voice.dev.yaml (the deterministic fake).
#
# BQ-MTG11-2 is decided (BQ-MTG11-13, the user, 2026-10-08): the voice is Google Cloud Text-to-Speech, a Chirp 3 HD
# voice, STREAMED (StreamingSynthesize), so the bot starts speaking about a second after the first reply text. The
# preview Gemini speech-output models are not used (PL-07 stays). Chirp 3 HD voice names look like
# `en-US-Chirp3-HD-<Name>`; the Name below is a voice the user can change here to any Chirp 3 HD voice of that locale.
#
# Cost (BQ-MTG11-3): metered by characters, profile `chirp3-hd` in config/prices.yaml (unit_price, unit character,
# US$0.03 per 1,000 = US$30 per 1M; the 1M free characters a month are a comment there, not subtracted).
voice:
  vendor: google-cloud-tts
  profile: chirp3-hd
  model: chirp-3-hd # the voice family; Cloud TTS takes no separate model id, the voice name below selects it
  voice: en-US-Chirp3-HD-Leda # a Chirp 3 HD voice; the locale prefix (en-US) is the request's language code
  sample_rate: 24000 # Hz of the raw 16-bit mono PCM requested from the service
  region: asia-southeast1 # regional endpoint asia-southeast1-texttospeech.googleapis.com; `global` is the default endpoint (BQ-MTG11-14)
  timeout_s: 15 # the deadline of one streaming request (seconds)
  max_chars: 400 # one reply's text (the bot already trims to this)
  max_audio_bytes: 2400000 # about 50 s at 24 kHz: a reply is a sentence or two
  # Gemini Live as an OPTIONAL alternative voice (M2, docs/VOICE_ARCHITECTURE.md 3.12). The flag is off: Chirp above
  # stays the voice. `enabled: true` swaps it for a Live session per reply (same caps above, 24 kHz PCM). Without the
  # user's LIVE=1 the flagged voice only replays hand-written recordings (a miss refuses, never goes live); a live call
  # also needs `price_approved: true`, which only the user sets once a current Live quote (PL-06) is approved. Model id
  # here only (PL-01); the PL-07 denylist applies to it even while the flag is off.
  live:
    enabled: false
    profile: gemini-live-voice
    model: gemini-3.8-live
    voice: Leda # a Gemini prebuilt voice name
    location: global # the Live endpoint
    timeout_s: 20 # the deadline of one spoken reply (seconds)
    max_output_tokens: 256 # the model's own output cap for one reply
    price_approved: false
