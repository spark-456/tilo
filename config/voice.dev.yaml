# DEV voice config (FR-MTG-11, EFF-01): the vendor is the deterministic fake (a tone derived from the text), so a meet-bot test
# or a bot started by hand without the live switch speaks offline. meet-bot/bot/providers.py reads this file unless the
# live switch is on (then config/voice.yaml) or TILO_VOICE_FILE says otherwise. Same shape and loader as config/voice.yaml.
voice:
  vendor: fake
  profile: voice-fake
  model: fake-voice
  voice: Fake
  sample_rate: 24000
  max_chars: 400
  max_audio_bytes: 2400000
