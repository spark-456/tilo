# The rates Tilo is charged per model profile, in US dollars per million tokens, plus any fee per 1,000 units
# (PL-06, FR-MTR-01, PRD 14.1: 1 credit = US$0.005). Shape: contracts/providers.schema.json $defs.prices (1.3.0,
# ADR-0029). Prices are never invented. status: set requires every price, the date and the source; the loader
# refuses live metering while status is unset.
#
# DRAFT for the user's approval (ADR-0029, PR "live web search, fetch, media, prices"). The rates below reached the
# architect through the supervisor on 2026-10-08; the user confirms them by approving the PR.
# Supersedes the 2026-09-24 sheet (ai.google.dev, global endpoint: flash 0.75 / 3.75, lite 0.25 / 1.50).
#
# Region (ADR-0029 decision 3): these are the asia-southeast1 regional endpoint's rates (10% above the global
# endpoint's). The loader refuses live metering of a profile whose adapter sends to another location: the google
# adapter's GOOGLE_LOCATION must be asia-southeast1 (its default is global, PRD 6.5 / D-14; BQ-LW-11). Adapters
# with no location (openai_compat, fake) are not checked, so config/models.gemini.yaml is metered at these rates.
#
# LIVE-GLOBAL-1 (14 Oct 2026): Gemini 3.x models are not served on the asia-southeast1 endpoint (404 for every
# profile below); only the global endpoint serves them, so GOOGLE_LOCATION is global and this sheet's region is global.
# The rates stay the user-approved regional ones (10% above global): the meter overstates, never understates. Model
# Armor stays regional (TILO_MODEL_ARMOR_LOCATION asia-southeast1); its one price applies everywhere, so it is not region-checked.
#
# Promotions (decision 4): flash-38, flash-37 and tts-flash are promotional through 2026-12-31 (valid_until); after
# that date the loader refuses live metering for them until this file is updated. From 2027-01-01 the global
# sheet listed flash at 1.50 / 7.50 (the regional 2027 rate was not supplied). The user decided (BQ-LW-7): meter
# flash at the full 0.825 / 4.125 (cached 0.0825) while Google's 50% net-spend credit runs, and reconcile against
# the bill net of credits (FR-MTR-08). Credits are never subtracted here: the meter overstates, never understates.
#
# Free allowances (decision 5) are recorded here only, never modelled; the meter charges from the first unit
# (BQ-LW-6): grounded search 5,000 queries a month; Model Armor 2M tokens a month; Cloud TTS 1M (Chirp 3 HD)
# or 4M (Neural2, WaveNet, Standard) characters a month.
#
# Not priced until a profile uses them (decision 5; no role names them on this base):
#   Cloud TTS, unit character, input 0 / output 0: Neural2 per_1k 0.016, WaveNet and Standard 0.004 (Chirp 3 HD is
#   priced below, FR-MTG-11). Gemini 3.8 Flash-Lite TTS: audio output 6.00 per 1M audio tokens (12.00 from 2027-01-01); its text
#   input rate was not supplied, and a set file holds no null, so it has no row yet (BQ-LW-9).
#   Speech-to-Text V2 Chirp, unit minute, per_1k 16 (dynamic batch 3). Imagen 4, unit image, per_1k 40 / 60 / 20
#   (PRD 12.4 draws charts by code, so there is no image role).
status: set
effective_date: "2026-10-08"
source: "user-supplied 2026-10-08, Google price pages, asia-southeast1 regional endpoint, paid Standard tier; applied to the global endpoint since 2026-10-14 (LIVE-GLOBAL-1)"
region: global
currency: USD
credit_usd: 0.005

profiles:
  embed-fake: { input: 0, output: 0 } # RT-05 offline vectors; no paid call
  # Paid tier, Standard, per 1M tokens; output includes thinking tokens. cached_input prices prompt-cache hits
  # (ADR-0022 tokens_cached); Tilo creates no explicit caches, so cache storage is not modelled.
  flash-38: { input: 0.825, output: 4.125, cached_input: 0.0825, valid_until: "2026-12-31" }
  flash-37: { input: 0.825, output: 4.125, cached_input: 0.0825, valid_until: "2026-12-31" }
  # lite-31 has no promotion. audio_input is per 1M audio input tokens (ADR-0027, about 25 tokens a second); flash's
  # audio input rate was not supplied, so audio input stays on lite-31 and flash cannot serve the speech role (BQ-LW-8).
  lite-31: { input: 0.275, output: 1.65, cached_input: 0.0275, audio_input: 0.55 }
  # The search role's profile (gemini-3.8-flash with the google_search tool): flash-38's token rates plus
  # US$14 per 1,000 search queries the model ran (2.8 credits a query), counted from grounding_metadata.
  search-google:
    input: 0.825
    output: 4.125
    cached_input: 0.0825
    unit_price: { unit: query, per_1k: 14 }
    valid_until: "2026-12-31"
  # Gemini 3.8 Flash TTS (FR-MTG-16; no profile names it yet, so the row is inert until one does): text input 0.50
  # per 1M tokens, output 9.00 per 1M audio output tokens (about 25 a second). From 2027-01-01: 1.00 / 18.00.
  tts-flash: { input: 0.50, output: 9.00, valid_until: "2026-12-31" }
  # The meeting bot's voice (FR-MTG-11, config/voice.yaml): Cloud Text-to-Speech, Chirp 3 HD, streamed. Metered by
  # input characters only (no tokens): US$0.03 per 1,000 = US$30 per 1M. No promotion, so no valid_until. The 1M free
  # characters a month are not subtracted (decision 5): the meter charges from the first character.
  chirp3-hd: { input: 0, output: 0, unit_price: { unit: character, per_1k: 0.03 } }
  # The profiles below make no paid call, so their price is 0 by decision (PL-06, 2026-10-04):
  # Model Armor bills per token screened, so it is an input price and output is 0. US$0.10 per 1M tokens
  # (standalone), from https://cloud.google.com/security/products/model-armor and
  # https://cloud.google.com/security-command-center/pricing, read 2026-10-06.
  armor-default: { input: 0.10, output: 0 }
  safety-fake: { input: 0, output: 0 } # the dev fake safety screen; makes no paid call
  eval-fake: { input: 0, output: 0 } # config/models.dev.yaml's fake eval judge (VERTEX-EVAL-1); makes no paid call
  # LW-05: config/models.dev.yaml's fake search; makes no paid call (the search role wants a query unit_price).
  search-fake: { input: 0, output: 0, unit_price: { unit: query, per_1k: 0 } }
  director-dev: { input: 0, output: 0 } # config/models.dev.yaml's fake Director; makes no paid call
  specialist-fake: { input: 0, output: 0 } # config/models.dev.yaml's fake skill-capture model (SKILLS-4); makes no paid call
  meeting-fake: { input: 0, output: 0 } # config/models.dev.yaml's fake meeting-bot model (FR-MTG-11); makes no paid call
  # PL-02/ADR-0003: config/models.nim.yaml's profiles need a price entry too --
  # the loader's PL-06 start-up check (every profile has one) runs whichever
  # models file TILO_MODELS_FILE selects, against this same prices.yaml.
  # NVIDIA NIM free trial endpoint: no per-token charge, so 0.
  nim-gemma-4-31b: { input: 0, output: 0 }
  nim-gemma-3-27b: { input: 0, output: 0 }
