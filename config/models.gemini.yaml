# EXAMPLE model profiles routing every role to the Gemini API's OpenAI-compatible endpoint,
# for live tests with real Gemini models before Google Cloud billing exists (ADR-0003).
# Selected instead of config/models.yaml by setting TILO_MODELS_FILE=config/models.gemini.yaml
# (tilo_providers.config.resolve_models_path); no code edit needed. Shape mirrors
# config/models.yaml: contracts/providers.schema.json $defs.models.
#
# NOT the submitted build's default: the submission routes every role through the google
# adapter on Vertex AI (PRD 4.4). Recordings made with this file are not submission evidence;
# redo them on Vertex once billing works.
#
# Profile ids match config/models.yaml on purpose: the same Gemini models at the same list
# prices, so config/prices.yaml needs no extra entries. Caps list only what the openai_compat
# adapter implements (text, JSON and tools); thinking, vision, audio and grounding stay with
# the google adapter.
#
# Endpoint and model ids from Google's Gemini API docs, retrieved 2026-09-26:
#   - https://ai.google.dev/gemini-api/docs/openai (base URL below)
#   - https://ai.google.dev/gemini-api/docs/pricing (gemini-3.8-flash, gemini-3.7-flash,
#     gemini-3.1-flash-lite)
#
# Free-tier keys: Google may use prompts and replies to improve its products. Send synthetic
# test data only, never pilot data or real email. The key lives in the git-ignored .env as
# GEMINI_API_KEY, typed by the user; calls happen only under the user's LIVE=1.
example: true

profiles:
  flash-38:
    provider: openai_compat
    model: gemini-3.8-flash
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
    context: 1000000
    caps: [json, tools]
  flash-37:
    provider: openai_compat
    model: gemini-3.7-flash
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
    context: 1000000
    caps: [json, tools]
  lite-31:
    provider: openai_compat
    model: gemini-3.1-flash-lite
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
    context: 1000000
    caps: [json, tools]

roles:
  # The Director's `thinking: high` is only the default for a caller that sets no level (BQ-LE2E-10): planning calls
  # set low (brief) or medium (approaches, plan) themselves.
  director: { primary: flash-38, fallback: flash-37, thinking: high, max_input_tokens: 100000, max_output_tokens: 16384 }
  lead: { primary: flash-38, fallback: flash-37, thinking: medium, max_output_tokens: 16384 }
  # COST-AUDIT: the Lead's district review is a short plain-text verdict on the cheap tier, no thinking (tilo_harness.lead_review)
  lead_review: { primary: lite-31, fallback: flash-37, max_output_tokens: 1024 }
  specialist: { primary: lite-31, fallback: flash-37, thinking: low, max_output_tokens: 8192 } # EFF-02: cheapest first
  verifier: { primary: flash-38, fallback: flash-37, thinking: high, max_input_tokens: 100000, max_output_tokens: 16384 }
  writer: { primary: flash-38, fallback: flash-37, thinking: low, max_output_tokens: 16384 }
  narrator: { primary: lite-31, fallback: flash-37, max_output_tokens: 4096 }
  autopilot: { primary: flash-37, fallback: lite-31, max_input_tokens: 16000 }
  generator: { primary: flash-38, fallback: flash-37, thinking: low }
  autorater: { primary: flash-37, fallback: lite-31 }
  assistant: { primary: lite-31, fallback: flash-37, max_input_tokens: 8000, max_output_tokens: 1000 } # FR-PA-19
  # FR-MTG-11: the meeting bot's two roles (meet-bot/bot/providers.py asks for these, never a model). `meeting` is the
  # agenda analysis (JSON in, JSON out, about 12000 characters of transcript); `meeting_fast` answers one question in a
  # sentence on the cheapest profile. Caps per EFF-03; the fallback (NFR-25) serves a quota or provider error only.
  meeting: { primary: flash-37, fallback: lite-31, max_input_tokens: 16000, max_output_tokens: 2048 }
  meeting_analyst: { primary: flash-37, fallback: lite-31, max_input_tokens: 100000, max_output_tokens: 16384 }
  meeting_fast: { primary: lite-31, fallback: flash-37, max_input_tokens: 8000, max_output_tokens: 256 }
  # ADR-0028 (MROOM-A1): the meeting room's replies, one call over what the addressed agent recorded (`meeting` is the
  # meet-bot's role). Quick: no thinking, 800 out; thinking: low, 4000 out. NFR-25 fallbacks; the user picks final models.
  meeting_room: { primary: lite-31, fallback: flash-37, max_input_tokens: 12000, max_output_tokens: 800 }
  meeting_room_thinking: { primary: flash-37, fallback: lite-31, thinking: low, max_input_tokens: 12000, max_output_tokens: 4000 }

rules:
  deny: ["gemini-2.5-*", "*-preview*"]
