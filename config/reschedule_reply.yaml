# Reschedule reply (FR-CAL-07 b, ticket 3; BQ-CAL07B-5 to -9). Read by tilo_channels.reschedule_reply.
# The working window comes from config/personal.yaml `working_window`; the time zone is the person's.
# Every word of the reply body is here or in a computed slot: no model writes a time. A malformed file means
# no reschedule draft at all (fail closed).

lead_minutes: 120 # a proposed time starts at least this long after "now"
default_duration_min: 30 # when neither the moved meeting nor the mail gives a length
max_slots: 3 # at most 3 (hard cap in the loader)
horizon_days: 14 # at most 14 (find_free_slots caps it too)
step_min: 15
buffer_min: 0
working_days: [0, 1, 2, 3, 4] # Monday = 0

weekdays: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]
months: [January, February, March, April, May, June, July, August, September, October, November, December]
# Fields: weekday, day, month, year, hour, minute, zone (the person's time-zone name).
slot_line: "{weekday} {day} {month} {year}, {hour}:{minute} ({zone})"

# "{slots}" is replaced by one "- " line per proposed time.
proposal_body: |
  Hello,

  Thank you for letting me know. These times are free for me:

  {slots}

  Please tell me which one suits you.

  Best regards
holding_body: |
  Hello,

  Thank you for your message. I will get back to you with new times soon.

  Best regards

# Shown to the person next to the card (or instead of it); one per status.
notes:
  proposed: "Times below were checked against your synced calendar."
  not_synced: "Your calendar is not synced, so no times were proposed. A holding reply is drafted."
  unreadable: "Your calendar could not be read, so no times were proposed. A holding reply is drafted."
  no_free_time: "No free time was found in the next 14 days. A holding reply is drafted."
  no_meeting: "No meeting of yours matches this mail, so nothing was drafted."
  not_participant: "The sender is not a participant of the matching meeting, so nothing was drafted."
  not_configured: "Reschedule replies are not configured, so nothing was drafted."
  no_time_zone: "Your time zone is not set, so nothing was drafted."
