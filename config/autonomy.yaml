# Risk tiers (PRD 10.4). Shape: contracts/policy.schema.json#/$defs/risk_tier_table.
# The deterministic policy engine (P4) loads this table; `just contracts-check` validates it.
# An action type not listed here is T3 (BQ-44). A modifier raises any action to T3, and all six
# are required by the schema, so none can be dropped. T3 runs at L1 only: a person decides.
#
# grant_budget (FR-INT-08, issue #64, ADR-0002 decision 14, BQ-75) is PRD 10.4's T1 example
# "spend credits under the run budget": a budget grant that keeps the run within its run cap.
# This table holds no credit amounts. The run cap (`caps.run_credits` in config/metering.yaml,
# MT-03, PRD 17.3) must bound every grant, but `Treasury.grant` does not enforce it yet (issue
# #51). A `grant_budget` policy with `limits.credits: null` covers no cap: the engine gates it
# (issue #106, BQ-100). Until the run cap is also enforced (issue #51), nothing may call
# `request_budget_grant` without a person's own approval, for example a harness auto-start or
# FR-MTR-03 top-ups (ADR-0002 decision 14).
# A grant goes through no connector, so its connector id is the reserved `internal`.
#
# build_handoff (FR-CON-16, supplement 2026-10-05 s6) hands company data to an outside build partner, so it
# is T3 and always needs a person. It is listed, not left to the unlisted-is-T3 default, so that removing the
# line by mistake cannot pass unnoticed: the FR-CON-16 config test pins it at T3.
# create_meeting_event (meeting_host, FR-MTG-09) invites people from the meeting bot's own Google account, so it is
# T3 and always needs a person; listed for the same reason as build_handoff (the FR-MTG-09 config test pins it).
# read_events (google_calendar, FR-CAL-08) reads the person's own calendar: no side effect, never
# gated, never an outbox entry. Listed so the table and config/connectors.yaml agree on its tier.
# web_search and fetch_url (web, ADR-0029 decision 7, PRD 12.2) read the public web: no side effect, never gated,
# never an outbox entry. Listed because an unlisted action is T3, which would put a person in front of every search.
# create_event (google_calendar, ADR-0035 decision 6) adds an event with no guests to the person's own primary
# calendar: T1, an approval card and an undo window. create_event_with_guests invites guests and Google emails them
# (FR-CAL-04), so it is T3 and always needs a person, listed so removing the line cannot pass unnoticed.
# org_model_key_change (ADR-0041 BK-07, `/v1/org/model-key`) sets or widens an org's own model key: it sends the
# org's data to a new third party, so it is T3 and always needs a person. Listed, not left to the unlisted-is-T3
# default, so that removing the line by mistake cannot pass unnoticed: the BYOK-3a config test pins it at T3.
# send_push (web_push, FR-CHN-17) shows a short notice on the person's own signed-in device. T1: no new recipient
# and no attachment; the text is the card title (and a short body), cleaned like a quote (control characters out,
# the shared secret redactor, addresses, links and phone numbers masked, cut on a word boundary), and the payload
# carries only a relative path built from the card id. A card flagged by injection detection, or not known to be
# clean, is T3 (the safety_flag modifier): a person decides, so no push. Its adapter lives in tilo-channels, not in
# config/connectors.yaml (nothing for a person to connect); the SEC-11 file names it on purpose. A standing L3
# policy of the owner's own opens it through the outbox; with none it gates like any action (BQ-CHN17-1).
# search_email, read_email (gmail), list_files and read_file (google_drive) are the agents' read tools of ADR-0048
# (with read_events): reads of the person's own account in their own world, no side effect, never gated, never an
# outbox entry (ADR-0035 decision 6 already gave them T1). Listed because an unlisted action is T3 (BQ-44), which
# would put a person in front of every read; the SEC-11 test keeps each of them an ungated read.
actions:
  read_events: T1
  search_email: T1
  read_email: T1
  list_files: T1
  read_file: T1
  send_push: T1
  web_search: T1
  fetch_url: T1
  create_draft: T1
  save_file: T1
  save_as_google_file: T1
  grant_budget: T1
  send_email: T2
  post_status_update: T2
  share_file: T3
  delete_file: T3
  build_handoff: T3
  create_meeting_event: T3
  create_event: T1
  update_event: T2
  create_event_with_guests: T3
  org_model_key_change: T3
modifiers:
  - {condition: new_recipients, raises_to: T3}
  - {condition: attachments, raises_to: T3}
  - {condition: external_sharing, raises_to: T3}
  - {condition: deletion, raises_to: T3}
  - {condition: money_or_legal, raises_to: T3}
  - {condition: safety_flag, raises_to: T3}
max_level:
  T1: L3
  T2: L3
  T3: L1
