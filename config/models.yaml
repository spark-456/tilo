# EXAMPLE model profiles, copied from PRD 6.4 so the provider layer has something to load.
# These are examples only: the user chooses the final models at setup under the efficiency
# rules in PRD 6.6, and changes go through a pull request. Shape: contracts/providers.schema.json
# $defs.models. Model ids appear only in config/ and packages/providers (PL-01).
# Profiles are ranked by cost from config/prices.yaml, which stays unset until the user sets it.
example: true

profiles:
  flash-38:
    provider: google
    model: gemini-3.8-flash
    context: 1000000
    caps: [json, tools, vision, audio, thinking, computer_use, grounding]
  flash-37:
    provider: google
    model: gemini-3.7-flash
    context: 1000000
    caps: [json, tools, vision, audio, thinking]
  lite-31:
    provider: google
    model: gemini-3.1-flash-lite
    context: 1000000
    caps: [json, tools]
  # FR-INT-02 (issue #103): the dev safety screen. The provider layer refuses a fake safety profile in
  # live mode or when deployed (K_SERVICE set), so intake fails closed there until Model Armor is wired.
  safety-fake:
    provider: fake
    model: fake-safety
    context: 1000000
    caps: []

roles:
  # max_input_tokens (EFF-03): 100000, under the smallest context of any example profile (NIM: 128000)
  director: { primary: flash-38, fallback: flash-37, thinking: high, max_input_tokens: 100000 }
  lead: { primary: flash-38, fallback: flash-37, thinking: medium }
  specialist: { primary: flash-37, fallback: lite-31 }
  verifier: { primary: flash-38, fallback: flash-37, thinking: high }
  writer: { primary: flash-38, fallback: flash-37 }
  narrator: { primary: lite-31, fallback: flash-37 } # fallback added for NFR-25 (BQ-18)
  autopilot: { primary: flash-37, fallback: lite-31, max_input_tokens: 16000 }
  # issue #272 (b): the live scenario generator (evals/generator.yaml caps its spend) and its autorater.
  generator: { primary: flash-38, fallback: flash-37, thinking: low }
  autorater: { primary: flash-37, fallback: lite-31 }
  # FR-PA-19: the assistant panel's fallback (config/assistant.yaml) on the cheapest profile; the
  # fallback (NFR-25) is used only on a provider error. Per-call caps: 8000 tokens in, 1000 out (EFF-03).
  assistant: { primary: lite-31, fallback: flash-37, max_input_tokens: 8000, max_output_tokens: 1000 }
  safety: { primary: safety-fake, fallback: safety-fake } # screens use the primary only; never a weaker fallback

rules:
  deny: ["gemini-2.5-*", "*-preview*"]
