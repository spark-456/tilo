# EXAMPLE model profiles, copied from PRD 6.4 so the provider layer has something to load.
# These are examples only: the user chooses the final models at setup under the efficiency
# rules in PRD 6.6, and changes go through a pull request. Shape: contracts/providers.schema.json
# $defs.models. Model ids appear only in config/ and packages/providers (PL-01).
# Profiles are ranked by cost from config/prices.yaml, which stays unset until the user sets it.
example: true

profiles:
  # ADR-0029 decision 6: video and documents (a PDF read natively, FR-INT-02) are capabilities; media_tokens are
  # the provider's tokens per image, PDF page and second of audio or video, upper bounds (1,120 is the stated
  # maximum for an image), used only for pre-flight estimates and the EFF-03 cap check. Billing uses reported usage.
  flash-38:
    provider: google
    model: gemini-3.8-flash
    context: 1000000
    caps: [json, tools, vision, audio, video, documents, thinking, computer_use, grounding, code_execution]
    media_tokens: { image: 1120, pdf_page: 1120, audio_per_second: 25, video_per_second: 258 }
  flash-37:
    provider: google
    model: gemini-3.7-flash
    context: 1000000
    caps: [json, tools, vision, audio, video, documents, thinking, code_execution]
    media_tokens: { image: 1120, pdf_page: 1120, audio_per_second: 25, video_per_second: 258 }
  lite-31:
    provider: google
    model: gemini-3.1-flash-lite
    context: 1000000
    caps: [json, tools, vision, audio, video, documents]
    media_tokens: { image: 1120, pdf_page: 1120, audio_per_second: 25, video_per_second: 258 }
  # GOOGLE-MAX: `code_execution` on the two flash profiles lets a caller send tools=[{"code_execution": {}}] (Gemini's
  # sandboxed Python; no fee beyond the tokens it adds) and read GenerateResponse.code_runs. No role sends it yet.
  # ADR-0029 decision 7: the search role's profile. Same model as flash-38, its own price row (a fee per search
  # query on top of the token rates). The SearchProvider adapter sends Gemini's google_search tool and refuses the
  # URL-context tool: every fetch goes through tilo-browser (egress allowlist, robots.txt, raw archive; LW-08).
  search-google:
    provider: google
    model: gemini-3.8-flash
    context: 1000000
    caps: [json, grounding]
  # FR-INT-02 (issue #103): the dev safety screen. The provider layer refuses a fake safety profile in
  # live mode or when deployed (K_SERVICE set); config/models.dev.yaml's safety role uses it, the production role uses armor-default.
  safety-fake:
    provider: fake
    model: fake-safety
    context: 1000000
    caps: []
  # RT-05 / BQ-MEMB-7: owner-approved Vertex text embeddings; dev/CI use models.dev.yaml's fake.
  embed-google: { provider: google, model: gemini-embedding-001, context: 2048, caps: [] }
  # FR-INT-02: Model Armor. `model` is the Model Armor template id (not a model); the project is
  # GOOGLE_CLOUD_PROJECT and the location TILO_MODEL_ARMOR_LOCATION (default asia-southeast1).
  armor-default:
    provider: model_armor
    model: tilo-default
    context: 1000000
    caps: []

roles:
  embed: { primary: embed-google, fallback: embed-google } # vectors from different profiles cannot be mixed
  # PL-02 / BQ-PL02-1: thinking tokens count against max_output_tokens, so a role that thinks states a cap that fits
  # thinking plus the JSON reply (16384 for high and medium). Not a model limit: the repo states none.
  # max_input_tokens (EFF-03): 100000, under the smallest context of any example profile (NIM: 128000)
  # `thinking` is only the DEFAULT for a caller that sets no level: the Router fills it in per profile that declares the
  # thinking capability (BQ-LE2E-10). The Director's planning calls set their own: brief extraction low, approaches and
  # plan compile medium (thinking tokens are billed as output), so `high` is not what a plain planning call pays for.
  director: { primary: flash-38, fallback: flash-37, thinking: high, max_input_tokens: 100000, max_output_tokens: 16384 }
  lead: { primary: flash-38, fallback: flash-37, thinking: medium, max_output_tokens: 16384 }
  # COST-AUDIT: the Lead's district review is a short plain-text verdict on the cheap tier, no thinking (tilo_harness.lead_review)
  lead_review: { primary: lite-31, fallback: flash-37, max_output_tokens: 1024 }
  # Long-text roles (8 Oct 2026, live run 2: both writer calls stopped `truncated` with 0 visible tokens): without a cap the
  # Router sends 1024 (BQ-63) and the model's own thinking uses all of it, so a role that writes a document or a research
  # note states a cap that fits thinking plus the text, and thinks little.
  specialist: { primary: lite-31, fallback: flash-37, thinking: low, max_output_tokens: 8192 } # EFF-02: cheapest first
  # ADR-0034 decision 3 / ADR-0051 decision A (TS-20): the one understanding step for describe, upload and record. It
  # reads typed words, documents and (S2) a recording as delimited data, so both profiles declare json, vision, video and
  # documents; lite-31 carries an audio_input price, flash-37 does not (a recording with sound is read only by a profile
  # that has one). max_output_tokens fits thinking plus the JSON reply. The user picks the final models and prices.
  skill_capture: { primary: lite-31, fallback: flash-37, thinking: low, max_output_tokens: 8192 }
  verifier: { primary: flash-38, fallback: flash-37, thinking: high, max_input_tokens: 100000, max_output_tokens: 16384 }
  writer: { primary: flash-38, fallback: flash-37, thinking: low, max_output_tokens: 16384 }
  narrator: { primary: lite-31, fallback: flash-37, max_output_tokens: 4096 } # fallback added for NFR-25 (BQ-18)
  autopilot: { primary: flash-37, fallback: lite-31, max_input_tokens: 16000 }
  # issue #272 (b): the live scenario generator (evals/generator.yaml caps its spend) and its autorater.
  generator: { primary: flash-38, fallback: flash-37, thinking: low }
  autorater: { primary: flash-37, fallback: lite-31 }
  # FR-PA-19: the assistant panel's fallback (config/assistant.yaml) on the cheapest profile; the
  # fallback (NFR-25) is used only on a provider error. Per-call caps: 8000 tokens in, 1000 out (EFF-03).
  assistant: { primary: lite-31, fallback: flash-37, max_input_tokens: 8000, max_output_tokens: 1000 }
  # FR-MTG-11: the meeting bot's two roles (meet-bot/bot/providers.py asks for these, never a model). `meeting` is the
  # agenda analysis (JSON in, JSON out, about 12000 characters of transcript); `meeting_fast` answers one question in a
  # sentence on the cheapest profile. Caps per EFF-03; the fallback (NFR-25) serves a quota or provider error only.
  meeting: { primary: flash-37, fallback: lite-31, max_input_tokens: 16000, max_output_tokens: 2048 }
  meeting_analyst: { primary: flash-37, fallback: lite-31, max_input_tokens: 100000, max_output_tokens: 16384 }
  meeting_fast: { primary: lite-31, fallback: flash-37, max_input_tokens: 8000, max_output_tokens: 256 }
  # ADR-0028 (MROOM-A1): the meeting room's replies, one call over what the addressed agent recorded (`meeting` is the
  # meet-bot's role). Quick: no thinking, 800 out; thinking: low, 4000 out. NFR-25 fallbacks; the user picks final models.
  meeting_room: { primary: lite-31, fallback: flash-37, max_input_tokens: 12000, max_output_tokens: 800 }
  meeting_room_thinking: { primary: flash-37, fallback: lite-31, thinking: low, max_input_tokens: 12000, max_output_tokens: 4000 }
  # EFF-03: 65536 is Model Armor's own per-request limit for the prompt-injection, RAI and CSAM filters
  # (https://docs.cloud.google.com/model-armor/quotas, read 2026-10-06); the screen refuses a larger input.
  safety: { primary: armor-default, fallback: armor-default, max_input_tokens: 65536 } # primary only; never a weaker fallback
  # ADR-0029 decision 7 (PRD 12.2 web search): every SearchProvider call. A fallback without grounding would answer
  # from memory, so the fallback is the same profile (retried once, NFR-25). reserve_units: search queries reserved
  # under the PL-03 budget check before sending, since Gemini decides how many it runs (BQ-LW-10 proposes 5).
  # max_output_tokens: a grounded answer with its citations; the router default of 1024 (BQ-63) would cut it.
  search: { primary: search-google, fallback: search-google, max_input_tokens: 8000, max_output_tokens: 4096, reserve_units: 5 }

rules:
  deny: ["gemini-2.5-*", "*-preview*"]
