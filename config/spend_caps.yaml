# Live-model spend caps and the per-uid rate limit (SEC-16, PRD supplement 4; FR-MTR-04, PRD 14.1, 17.3).
# Shape: contracts/spend_caps.schema.json. Loader: tilo_api.spend.load_spend_caps (every key required, no others).
# Money is an integer in INR minor units (paise; 1 INR = 100), never a float. A day is the UTC calendar day.
# Where the PRD gives a US dollar figure it is converted at 80 INR per US$, below the market rate, so each INR
# cap is at most its US$ counterpart (BQ-SEC16-1, a default the user may change).

currency: INR
uid_lifetime_minor: 100000 # SEC-16: 1,000 INR per uid over its lifetime (the user, 5 Oct)
run_minor: 12000 # 120 INR per run: PRD 17.3's 300 credits per public run is US$1.50
org_day_minor: null # no separate per-org daily cap (as BQ-42 for credits); the deployment cap below applies
global_day_hard_minor: 200000 # 2,000 INR per UTC day: PRD 17.3's US$25 hard cap; reaching it turns replay-only (NFR-24)
rate_limit_requests: 240 # per uid per window; the web polls a run's events every second (BQ-SEC16-1)
rate_limit_window_s: 60 # sliding window, seconds
