# DEV-ONLY model profiles (CL-INT-5, EFF-01): the Director role is a deterministic fake, so `just dev-api` takes
# any task text through intake, questions and approaches with no recordings and no paid call. `just dev-api`
# selects this file when TILO_MODELS_FILE is unset (tilo_api.dev); set TILO_MODELS_FILE to override it.
#
# NEVER production. The provider layer refuses a `fake-director` profile when K_SERVICE or CLOUD_RUN_JOB is set
# or LIVE=1, at config load and on every call. It never counts as conforming for a real role (PL-05).
# Replies are synthetic: derived only from the task text, plus fixed demo constants, tagged "(dev)".
# Shape mirrors config/models.yaml: contracts/providers.schema.json $defs.models.
example: true

profiles:
  director-dev:
    provider: fake
    model: fake-director
    context: 1000000
    caps: [json]
  safety-fake:
    provider: fake
    model: fake-safety
    context: 1000000
    caps: []
  # LW-05: the dev search; `FakeSearchProvider` answers from the query alone and is refused live or deployed.
  search-fake:
    provider: fake
    model: fake-search
    context: 1000000
    caps: [grounding]
  # FR-MTG-11: the meeting bot's dev profile. A deterministic FakeModelProvider (canned text from the prompt), so every
  # meet-bot test and `python -m bot.main` without LIVE=1 is offline. Not refused when live (it is not a dev-only
  # model like fake-director), but the bot only reads this file when LIVE is not 1 and TILO_MODELS_FILE is unset.
  meeting-fake:
    provider: fake
    model: fake-meeting
    context: 1000000
    caps: [json]

roles:
  director: { primary: director-dev, fallback: director-dev }
  safety: { primary: safety-fake, fallback: safety-fake } # screens use the primary only
  search: { primary: search-fake, fallback: search-fake, max_input_tokens: 8000, max_output_tokens: 4096, reserve_units: 5 }
  meeting: { primary: meeting-fake, fallback: meeting-fake, max_input_tokens: 16000, max_output_tokens: 2048 }
  meeting_fast: { primary: meeting-fake, fallback: meeting-fake, max_input_tokens: 8000, max_output_tokens: 256 }
  # ADR-0028 (MROOM-A1): the meeting room's replies (`meeting` is the meet-bot's role, so these are `meeting_room*`).
  meeting_room: { primary: meeting-fake, fallback: meeting-fake, max_input_tokens: 12000, max_output_tokens: 800 }
  meeting_room_thinking: { primary: meeting-fake, fallback: meeting-fake, max_input_tokens: 12000, max_output_tokens: 4000 }

rules:
  deny: ["gemini-2.5-*", "*-preview*"]
