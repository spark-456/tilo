# Shipped connectors (PRD 12.1). Shape: contracts/connector.schema.json, one entry per connector;
# loaded by tilo_connectors.registry.load_registry. Scopes are least privilege per capability (PRD 16.1):
# Gmail never asks for mail.google.com or gmail.modify; Drive uses drive.file only (the files the user
# picks and the files Tilo creates, PRD 12.2). Each action's risk_tier equals config/autonomy.yaml.
- id: gmail
  name: Gmail
  icon: mail
  auth: oauth2
  scopes:
    read: ["https://www.googleapis.com/auth/gmail.readonly"]
    search: ["https://www.googleapis.com/auth/gmail.readonly"]
    write: ["https://www.googleapis.com/auth/gmail.compose"]
    send: ["https://www.googleapis.com/auth/gmail.send"]
  capabilities: [read, search, write, send]
  actions:
    - {id: read_email, capability: read, description: "Read a thread the task needs.", risk_tier: T1, gate_type: none, irreversible: false}
    - {id: search_email, capability: search, description: "Search the mailbox.", risk_tier: T1, gate_type: none, irreversible: false}
    - {id: create_draft, capability: write, description: "Save a reply as a draft.", risk_tier: T1, gate_type: approval, irreversible: false}
    - {id: send_email, capability: send, description: "Send a reply in an existing thread.", risk_tier: T2, gate_type: approval, irreversible: true}
  limits: {per_minute: 60, batch_size: 50}
  data_class: {returns: [personal, business], redact: [body_signature, phone_numbers]}

- id: google_drive
  name: Google Drive
  icon: folder
  auth: oauth2
  scopes:
    read: ["https://www.googleapis.com/auth/drive.file"]
    list: ["https://www.googleapis.com/auth/drive.file"]
    write: ["https://www.googleapis.com/auth/drive.file"]
  capabilities: [read, list, write]
  actions:
    - {id: read_file, capability: read, description: "Read the files you pick in Drive.", risk_tier: T1, gate_type: none, irreversible: false}
    - {id: list_files, capability: list, description: "See the files in the folder you pick.", risk_tier: T1, gate_type: none, irreversible: false}
    - {id: save_file, capability: write, description: "Save finished work in a Tilo folder in your Drive.", risk_tier: T1, gate_type: approval, irreversible: false}
    - {id: save_as_google_file, capability: write, description: "Save a deck, doc or sheet as a Slides, Docs or Sheets file in a Tilo folder in your Drive.", risk_tier: T1, gate_type: approval, irreversible: false}
  limits: {per_minute: 60, batch_size: 50}
  data_class: {returns: [personal, business], redact: []}

# Build partner (PRD supplement 2026-10-05 s6, SD-03; FR-CON-16, FR-CON-17). Link route only: Tilo makes a
# Lovable "Build with URL" link from the person-accepted requirements and the person presses send in Lovable,
# so there is no key, no token and no scope (auth none), and Tilo makes no call to Lovable. build_handoff is
# `send`: it delivers a composed prompt to an outside party (`share` grants access to a stored file). It is T3
# (also listed in config/autonomy.yaml) and irreversible: once the person opens the link the prompt and the
# granted data it carries are with Lovable. Route limits are in config/build_partners.yaml. Listed after gmail
# and google_drive: the dev Director takes the first gated action in catalogue order.
- id: lovable
  name: Lovable
  icon: build
  auth: none
  scopes: {}
  capabilities: [send]
  actions:
    - {id: build_handoff, capability: send, description: "Hand the accepted requirements to Lovable as a build prompt you send yourself.", risk_tier: T3, gate_type: approval, irreversible: true}
  limits: {per_minute: null, batch_size: null}
  data_class: {returns: [business], redact: []}
# Google Calendar (FR-CAL-02, FR-CAL-08, FR-CON-14, FR-CAL-04; ADR-0035 decision 6): the person's own primary calendar.
# Reads sync with a sync token inside their working window (config/personal.yaml); the request's field mask asks
# Google for no description, attendee address, conference link or location, so there is nothing to redact (PE-13).
# Writing adds the one scope calendar.events.owned (events on calendars the person owns), asked only when a task
# needs it (incremental scopes, CON-D10): create_event (write) makes an event with no guests on their own primary
# calendar and is T1; create_event_with_guests (send) makes Google email the guests, so it is T3 and always needs a
# person (FR-CAL-04). per_minute is per connected person; batch_size is the page size (Google's maximum for events.list).
- id: google_calendar
  name: Google Calendar
  icon: calendar
  auth: oauth2
  scopes:
    read: ["https://www.googleapis.com/auth/calendar.readonly"]
    write: ["https://www.googleapis.com/auth/calendar.events.owned"]
    send: ["https://www.googleapis.com/auth/calendar.events.owned"]
  capabilities: [read, write, send]
  actions:
    - {id: read_events, capability: read, description: "Read the events on your own calendar to show them in Tilo.", risk_tier: T1, gate_type: none, irreversible: false}
    - {id: create_event, capability: write, description: "Add an event with no guests to your own Google Calendar.", risk_tier: T1, gate_type: approval, irreversible: false}
    - {id: create_event_with_guests, capability: send, description: "Add an event to your own Google Calendar and invite guests; Google emails them.", risk_tier: T3, gate_type: approval, irreversible: true}
  limits: {per_minute: 60, batch_size: 2500}
  data_class: {returns: [personal, business], redact: []}

# meeting_host (FR-MTG-09, ADR-0024): the meeting bot's OWN Google account creates a Calendar event with a Meet link
# and Google invites the attendees the Owner approved. The one write scope sits on that account, which holds no
# personal data; a person's own google_calendar grant writes only to their own primary calendar (above). Always T3 (the Owner is invited, so
# new_recipients applies). The Meet link is never stored; the request asks Google for none.
- id: meeting_host
  name: Tilo meeting host
  icon: calendar
  auth: oauth2
  scopes:
    send: ["https://www.googleapis.com/auth/calendar.events.owned"]
  capabilities: [send]
  actions:
    - {id: create_meeting_event, capability: send, description: "On the meeting bot's own Google account (sign in as the bot, not as yourself): create a meeting with a Meet link and invite the people you approve.", risk_tier: T3, gate_type: approval, irreversible: true}
  limits: {per_minute: 30, batch_size: 50}
  data_class: {returns: [business], redact: []}
