# EXAMPLE model profiles routing every role to NVIDIA NIM (ADR-0003, PL-02 ticket P0-05
# item 3): lets the user test the provider layer live without Google Cloud billing.
# Selected instead of config/models.yaml by setting TILO_MODELS_FILE=config/models.nim.yaml
# (tilo_providers.config.resolve_models_path) -- no code edit needed. Shape mirrors
# config/models.yaml: contracts/providers.schema.json $defs.models.
#
# NOT the submitted build's default: the submission routes every role to Google models on
# Google Cloud (PRD 4.4); NIM is for live testing only while billing is unavailable
# (ADR-0003 decision 2).
#
# Model ids verified against NVIDIA's public NIM catalog, retrieved 2026-09-25:
#   - https://build.nvidia.com/google/gemma-4-31b-it
#     (container nvcr.io/nim/google/gemma-4-31b-it, catalog.ngc.nvidia.com/orgs/nim/teams/google)
#   - https://build.nvidia.com/google/gemma-3-27b-it
# API base URL from the same catalog pages: https://integrate.api.nvidia.com/v1.
#
# Contract note (resolved, P0-02b/ADR-0002 1.1.0): base_url and api_key_env are fields on
# contracts/providers.schema.json $defs.profile (allowed only when provider == "openai_compat"),
# so this file loads through tilo_providers.config.load_providers_config like any other example
# config. Most NIM acceptance tests in packages/providers/tests still read this file's raw YAML
# directly, independent of the loader.
example: true

profiles:
  embed-fake: { provider: fake, model: fake-embed, context: 1000000, caps: [] } # RT-05
  nim-gemma-4-31b:
    provider: openai_compat
    model: google/gemma-4-31b-it
    base_url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY
    context: 128000
    caps: [json, tools]
  nim-gemma-3-27b:
    provider: openai_compat
    model: google/gemma-3-27b-it
    base_url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY
    context: 128000
    caps: [json, tools]

roles:
  embed: { primary: embed-fake, fallback: embed-fake } # RT-05
  # The Director's `thinking: high` is only the default for a caller that sets no level (BQ-LE2E-10): planning calls
  # set low (brief) or medium (approaches, plan) themselves. Specialist is already cheapest first (EFF-02).
  director: { primary: nim-gemma-4-31b, fallback: nim-gemma-3-27b, thinking: high, max_input_tokens: 100000, max_output_tokens: 16384 }
  lead: { primary: nim-gemma-4-31b, fallback: nim-gemma-3-27b, thinking: medium, max_output_tokens: 16384 }
  # COST-AUDIT: the Lead's district review is a short plain-text verdict on the cheap tier, no thinking (tilo_harness.lead_review)
  lead_review: { primary: nim-gemma-3-27b, fallback: nim-gemma-4-31b, max_output_tokens: 1024 }
  specialist: { primary: nim-gemma-3-27b, fallback: nim-gemma-4-31b, thinking: low, max_output_tokens: 8192 }
  skill_capture: { primary: nim-gemma-3-27b, fallback: nim-gemma-4-31b, thinking: low, max_output_tokens: 8192 } # ADR-0051 S1: text only (no video profile here)
  verifier: { primary: nim-gemma-4-31b, fallback: nim-gemma-3-27b, thinking: high, max_input_tokens: 100000, max_output_tokens: 16384 }
  writer: { primary: nim-gemma-4-31b, fallback: nim-gemma-3-27b, thinking: low, max_output_tokens: 16384 }
  narrator: { primary: nim-gemma-3-27b, fallback: nim-gemma-4-31b, max_output_tokens: 4096 }
  autopilot: { primary: nim-gemma-3-27b, fallback: nim-gemma-4-31b, max_input_tokens: 16000 }
  generator: { primary: nim-gemma-4-31b, fallback: nim-gemma-3-27b, thinking: low }
  autorater: { primary: nim-gemma-3-27b, fallback: nim-gemma-4-31b }
  assistant: { primary: nim-gemma-3-27b, fallback: nim-gemma-4-31b, max_input_tokens: 8000, max_output_tokens: 1000 } # FR-PA-19
  # FR-MTG-11: the meeting bot's two roles (meet-bot/bot/providers.py asks for these, never a model). `meeting` is the
  # agenda analysis (JSON in, JSON out, about 12000 characters of transcript); `meeting_fast` answers one question in a
  # sentence on the cheapest profile. Caps per EFF-03; the fallback (NFR-25) serves a quota or provider error only.
  meeting: { primary: nim-gemma-3-27b, fallback: nim-gemma-4-31b, max_input_tokens: 16000, max_output_tokens: 2048 }
  meeting_analyst: { primary: nim-gemma-3-27b, fallback: nim-gemma-4-31b, max_input_tokens: 100000, max_output_tokens: 16384 }
  meeting_fast: { primary: nim-gemma-3-27b, fallback: nim-gemma-4-31b, max_input_tokens: 8000, max_output_tokens: 256 }
  # ADR-0028 (MROOM-A1): the meeting room's replies, one call over what the addressed agent recorded (`meeting` is the
  # meet-bot's role). Quick: no thinking, 800 out; thinking: low, 4000 out. NFR-25 fallbacks; the user picks final models.
  meeting_room: { primary: nim-gemma-3-27b, fallback: nim-gemma-4-31b, max_input_tokens: 12000, max_output_tokens: 800 }
  meeting_room_thinking: { primary: nim-gemma-4-31b, fallback: nim-gemma-3-27b, thinking: low, max_input_tokens: 12000, max_output_tokens: 4000 }

rules:
  deny: ["gemini-2.5-*", "*-preview*"]
