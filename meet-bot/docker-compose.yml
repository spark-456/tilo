name: tilo-meet-bot

services:
  bot:
    image: tilo-meet-bot:latest
    build:
      # The repository root (FR-MTG-11): the image carries Tilo's provider layer, config/ and prompts/. What goes into the
      # context is whitelisted in docker/Dockerfile.dockerignore.
      context: ..
      dockerfile: meet-bot/docker/Dockerfile
    init: true
    cpus: ${BOT_CPUS:-2}
    mem_limit: ${BOT_MEM_LIMIT:-3g}
    shm_size: 512m
    env_file:
      - path: .env
        required: false
    environment:
      TILO_IN_CONTAINER: "1"
      PROFILE_DIR: /profile/chrome
      # Pass-through from the host shell for one-off runs (unset = value from .env).
      SAVE_CAPTION_SNAPSHOTS:
      ADMIT_ALLOWED_NAMES:
      REQUIRED_PARTICIPANTS:
      # The user's own live switch and Google project (README, Providers). Unset = the offline fake providers.
      LIVE:
      GOOGLE_CLOUD_PROJECT:
      GOOGLE_LOCATION:
    ports:
      # noVNC, reachable only from this computer. The VNC session has no password, so never widen this.
      - "127.0.0.1:6080:6080"
    volumes:
      - ./:/app                          # code, agenda.md, and outputs (out/, debug/) live on your disk
      - tilo_meet_profile:/profile       # the bot's signed-in browser profile (see DECISIONS.md)

volumes:
  tilo_meet_profile:
