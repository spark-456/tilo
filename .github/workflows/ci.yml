name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Only paths no repo test, script or gate reads (checked against tests/, scripts/, justfile).
    # Do NOT widen to docs/** or **/*.md: tests read CLAUDE.md, docs/prd, docs/adr, docs/licences.md, etc.
    paths-ignore:
      - "docs/screenshots/**"
      - ".claude/agent-memory/**"
  push:
    branches: [main]
    paths-ignore:
      - "docs/screenshots/**"
      - ".claude/agent-memory/**"

# A newer push to the same ref cancels the run still in flight (saves Actions minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Draft PRs are skipped; the run starts on ready_for_review.
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # EFF-01: dev and CI make no paid model calls unless LIVE=1. Block egress
      # to model endpoints before any setup or test step runs.
      - name: Block model endpoints (EFF-01)
        run: |
          echo "0.0.0.0 generativelanguage.googleapis.com" | sudo tee -a /etc/hosts
          echo "0.0.0.0 aiplatform.googleapis.com" | sudo tee -a /etc/hosts
          echo "0.0.0.0 asia-southeast1-aiplatform.googleapis.com" | sudo tee -a /etc/hosts
          echo "0.0.0.0 integrate.api.nvidia.com" | sudo tee -a /etc/hosts

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # pnpm/action-setup must precede setup-node so `cache: pnpm` can find the pnpm binary.
      # The version comes from package.json `packageManager`.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install just
        uses: extractions/setup-just@v2
        with:
          just-version: "1.36.0"

      # Firestore emulator binary (services/harness, P0-09) needs a JRE.
      - name: Set up Java (Firestore emulator, P0-09)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: just setup
        run: just setup

      - name: just check
        run: just check

      - name: Harness emulator tests (P0-09)
        run: uv run pytest services/harness/tests -m emulator

      - name: Secret scan (staged-file patterns, over the full tree in CI)
        run: uv run python scripts/secret_scan.py --all-tracked

      - name: Python dependency audit (SEC-13)
        # `pip-audit` with no args audits its OWN uvx venv, not Tilo's locked
        # deps — export the locked project set first and audit that, with a
        # pinned tool version so the audit itself isn't a moving target.
        run: |
          uv export --frozen --all-packages --no-emit-workspace -o audit-requirements.txt
          uvx pip-audit@2.10.1 --disable-pip -r audit-requirements.txt

      - name: JS dependency audit (SEC-13)
        run: pnpm audit --audit-level critical

  # Antigravity pull requests (branches ag-web/*, ag-eval/*) may change only their lane's paths (docs/lanes.md).
  lane-guard:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'ag-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lane paths (docs/lanes.md)
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/lane_guard.py --branch "$HEAD_REF" --base "$BASE_REF"
